<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0f">
  <title>FitCheck</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Ccircle cx=%2716%27 cy=%2716%27 r=%2712%27 fill=%27%23c6ff3a%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700&family=Karantina:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-inner">
      <a class="brand" href="#/feed">Fit<em>Check</em></a>
      <div class="top-actions">
        <label class="lang">
          <span class="sr-only" data-i18n="lang.label">Language</span>
          <select id="lang" class="pill" aria-label="Language"></select>
        </label>
        <a id="top-auth" class="pill accent" href="#/signup" data-i18n="auth.signup"></a>
      </div>
    </div>
  </header>

  <main id="view" class="view" aria-live="off"></main>

  <nav class="tabbar" aria-label="Main">
    <div class="tabbar-inner">
      <a class="tab" href="#/feed" data-tab="feed">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        <span data-i18n="nav.feed"></span>
      </a>
      <a class="tab" href="#/challenges" data-tab="challenges">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M7 6H4v2a3 3 0 0 0 3 3M17 6h3v2a3 3 0 0 1-3 3"/></svg>
        <span data-i18n="nav.challenges"></span>
      </a>
      <a class="tab check" href="#/check" data-tab="check">
        <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span data-i18n="nav.check"></span>
      </a>
      <a class="tab" href="#/activity" data-tab="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        <span data-i18n="nav.activity"></span>
        <span id="activity-badge" class="badge" hidden></span>
      </a>
      <a class="tab" href="#/me" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="nav.profile"></span>
      </a>
    </div>
  </nav>

  <input id="file" type="file" accept="image/*" class="sr-only" tabindex="-1">
  <!-- Live regions stay in the tree at all times; only their text changes, so screen readers announce it. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
