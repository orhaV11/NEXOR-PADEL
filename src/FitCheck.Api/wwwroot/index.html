<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b0b0f">
  <meta name="application-name" content="OREVOSH">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OREVOSH">
  <meta name="description" content="Check your look with a stylist, post it, get fire, meet the brands you wear.">
  <title>OREVOSH</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <div class="top-inner" id="top-inner">
      <a class="wordmark" href="#/" aria-label="OREVOSH">OREVOSH</a>
      <div class="top-actions" id="top-actions"></div>
    </div>
  </header>

  <div id="offline" class="offline" hidden></div>
  <main id="view" class="view" aria-live="off"></main>

  <nav class="tabbar" aria-label="Main" data-i18n-aria="nav.main">
    <div class="tabbar-inner">
      <a class="tab" href="#/" data-tab="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 3l9 8"/><path d="M5 10v10h5v-6h4v6h5V10"/></svg>
        <span data-i18n="nav.home"></span>
      </a>
      <a class="tab" href="#/explore" data-tab="explore">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
        <span data-i18n="nav.explore"></span>
      </a>
      <a class="tab check" href="#/check" data-tab="check">
        <span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></span>
        <span data-i18n="nav.check"></span>
      </a>
      <a class="tab" href="#/activity" data-tab="activity">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10 21a2 2 0 0 0 4 0"/></svg>
        <span data-i18n="nav.activity"></span>
        <span id="activity-badge" class="badge" hidden></span>
      </a>
      <a class="tab" href="#/me" data-tab="me">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>
        <span data-i18n="nav.profile"></span>
      </a>
    </div>
  </nav>

  <input id="file" type="file" accept="image/*" class="sr-only" tabindex="-1">
  <input id="avatar-file" type="file" accept="image/*" class="sr-only" tabindex="-1">
  <!-- Live regions stay in the tree at all times; only their text changes, so screen readers announce it. -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <div id="live" class="sr-only" role="status" aria-live="polite"></div>

  <script type="module" src="app/main.js"></script>
</body>
</html>
