<!doctype html>
<!-- A screenshot at the app's phone viewport (780×1688, 390×844 at 2×), cropped from the top, for the landing
     page's JPEGs. No fonts, no frame: the frame is drawn by the landing page's own CSS. -->
<html><head><meta charset="utf-8"><style>
  html, body { margin: 0; background: #0b0b0f; }
  img { display: block; width: {{w}}px; height: {{h}}px; object-fit: cover; object-position: top center; }
</style></head>
<body><img src="{{shot}}" alt=""></body></html>
