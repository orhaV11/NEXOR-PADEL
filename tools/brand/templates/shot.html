<!doctype html>
<!-- A screenshot at the app's phone viewport (780×1688, 390×844 at 2×) for the landing page's JPEGs: the capture
     (base.css, "the app screen"), at 1:1. No fonts of our own, no frame:
     the frame is drawn by the landing page's own CSS. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: {{w}}px; --h: {{h}}px; }
  html, body { margin: 0; background: #14101e; }
  .screen { width: {{w}}px; height: {{h}}px; overflow: hidden; }
</style></head>
<body><div class="screen">{{{screen}}}</div></body></html>
