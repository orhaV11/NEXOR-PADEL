<!doctype html>
<!-- A 1080×1920 story: the wordmark under the top safe zone, the headline, an optional line (the one tip, in the
     second story), the CTA as the app's gradient pill, and a phone with the screenshot running off the bottom edge
     (the bottom 250px sit behind the reply bar on Instagram, so nothing that matters is drawn there). -->
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="utf-8">
<title>OREVOSH — story</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Heebo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  :root { --w: {{w}}px; --h: {{h}}px; --pw: 720px; }
  main { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 250px 72px 0; box-sizing: border-box; }
  .wordmark { height: 60px; width: auto; }
  h1 { font-size: 116px; margin-top: 52px; max-width: 100%; }
  .sub { font-size: 44px; line-height: 1.35; margin: 28px 0 0; max-width: 860px; color: var(--ink-2); font-weight: 500; }
  .sub:empty { display: none; }
  .pill { height: 96px; padding: 0 56px; font-size: 38px; margin-top: 48px; }
  .device { position: relative; margin-top: 64px; }
  .device::before { content: ""; position: absolute; inset: -6% -24% auto; height: 70%; border-radius: 50%;
    background: radial-gradient(50% 50% at 50% 50%, rgba(255,143,177,.16), transparent 70%); }
  .phone { position: relative; }
</style>
</head>
<body class="stage">
  <main>
    <img class="wordmark" src="{{wordmark}}" alt="OREVOSH">
    <h1 class="display">{{title}}</h1>
    <p class="sub">{{sub}}</p>
    <div class="pill">{{cta}}</div>
    <div class="device"><div class="phone"><div class="screen"><img src="{{shot}}" alt=""></div></div></div>
  </main>
</body>
</html>
