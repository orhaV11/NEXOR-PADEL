<!doctype html>
<!--
  board.html · "the study's paperwork": the full-frame graphic scenes of the series that are neither a chat nor footage.
  Same contract as chat.html: a 1080 x 1920 page, the script as JSON in the query string (?s=...), a global seek(t) that
  draws second t deterministically, and the promise window.__ready. Any text may be {"en": .., "he": ..}.

    node src/film/render-chat.mjs <script.json> en <out.mp4> --page board.html [--still 3.2 out.png]

  THE LOOK (the same in every scene): a deep green field; on it a cream paper lying on a card folder (or cream cards),
  typed labels, the series stamp from stamp.js. A stamp jolts the paper under it (Stamp.shake). Nothing fades in at
  t = 0: the paper is on the desk on the first frame, so a scene can be cut in hard, and it holds its last state.
  WHERE THINGS SIT: the folder is x 40-1040, rows 415-1247, with its tab in rows 362-415 from x 40 (to x 470 with
  a file line of 19 characters); all text is in rows 362-1236. Rows 1250-1480 (the caption lane) hold background only. The block x 620-1040, rows 262-404 is left
  to the edit engine's day tag and chip; only "week" with a "count" draws there, in place of the engine's tag
  (switch the engine's tag off for that scene).

  SCRIPT   { "dur": seconds, "scene": "checklist" | "list" | "loop" | "cards" | "week", ...fields of the scene }
  Every time in a script is in seconds from the start of the scene. A time may be negative ("it already happened"):
  the thing is then drawn in its final state from the first frame (a moved tile, a corrected count, a landed stamp).
  A demo of each scene, with the words of the plan, is in src/film/tbc/demo_board_*.json.

  FIELDS EVERY SCENE TAKES (all optional)
    "file":  "THE STUDY · FILE 02"          typed on the tab of the folder, top left (in "cards": at the left of a
                                            typed line above the cards). Up to about 20 characters.
    "title": "STATUS OF BOOKINGS"           heads the paper, above a double rule (in "cards": at the right of the
                                            line above the cards). Up to about 34 characters.
    "note":  { "t": 4.4, "text": "THE WINNER HAD NOT BEEN ASKED." }
                                            one typed line on its own cream strip under the scene (rows 1164-1236);
                                            the scene above it becomes 90 px shorter. The strip slides in during the
                                            0.16 s before t, then the line is typed. Up to 34 characters.
    "cps":   40                             typing speed, characters per second (labels, values, the note)
    "guides": true                          draws the caption lane, the 4:5 crop and the tag block (for checking only)

  A STAMP (wherever a scene takes "stamp")
    { "t": 3.5, "text": "TO BE CONFIRMED", "color": "red" | "green" | "bright", "big": true,
      "small": "EPISODE 2", "size": 70, "rot": -8, "dx": 0, "dy": 0, "oneline": true }
    Only "t" and "text" are needed. "color" defaults to "red". A text longer than 12 characters with no "\n" in it is
    broken into two lines at the space nearest its middle ("TO BE" / "CONFIRMED"); write "\n" yourself to choose the
    break, or "oneline": true to forbid it. "big" is the joke stamp: larger, crooked (-8 degrees), and the paper
    jolts 16 px; a stamp that is not big lands nearly straight and the paper jolts 6 px. The stamp of "loop" and of
    "week" is always big. "small" is a small line under the text, inside the frame. "size" (px of the letters),
    "rot" (degrees) and "dx"/"dy" (px, a nudge from where the scene puts it) override the scene's choice. A stamp
    is kept on the paper. It lands in three frames from t (stamp.js); the sound is kit.thud at t.

  1. "checklist": typed labels on the left, each row's stamp on the right of its row.
     { "dur": 4.6, "scene": "checklist", "file": "THE STUDY · FILE 02", "title": "STATUS OF BOOKINGS",
       "rows": [
         { "label": "FLIGHTS",       "stamp": { "t": 0.5, "text": "BOOKED",   "color": "green" } },
         { "label": "HOTEL",         "stamp": { "t": 1.5, "text": "BOOKED",   "color": "green" } },
         { "label": "TIME OFF WORK", "stamp": { "t": 2.5, "text": "APPROVED", "color": "green" } },
         { "label": "DATE OF MATCH", "stamp": { "t": 3.5, "text": "TO BE CONFIRMED", "color": "red", "big": true } } ] }
     row: "label" (required); "t" = when the label is typed (omit: it is there on the first frame); "stamp" optional.
     A big stamp takes the room from the end of its label to the edge of the paper, and its row is made taller.
     2 to 6 rows; the letters shrink as rows are added (3 rows: 60 px, 4: 52, 5: 46, 6: 40), or set "size": 48.
     At 4 rows a label of up to 13 characters leaves room for its stamp.

  2. "list": label on the left, value on the right; each row is typed (label, then value) at its time.
     { "dur": 5.8, "scene": "list", "file": "THE STUDY · FILE 04", "title": "WHAT COULD BE MOVED",
       "rows": [
         { "t": 0.4, "label": "FLIGHTS",     "value": "MOVED, FOR A FEE" },
         { "t": 1.6, "label": "HOTEL",       "value": "BOOKED AGAIN" },
         { "t": 2.8, "label": "TOUR SHIRTS", "value": "PRINTED.\nTHEY SAY SATURDAY." },
         { "t": 4.0, "label": "THE MATCH",   "value": "MOVED, NO CHARGE", "mark": true },
         { "t": 4.9, "label": "NEW KICK-OFF TIME", "stamp": { "t": 5.4, "text": "TO BE CONFIRMED", "big": true } } ] }
     row: "t" = when its label starts to be typed (omit: the whole row is there on the first frame);
          "vt" = when its value starts (default: 0.1 s after the last letter of the label);
          "value" wraps inside its column, "\n" forces a break;
          "mark": true underlines the row in gold 0.12 s after the last letter of its value, or "mark": { "t": 4.8 };
          "stamp": with no value it lands where the value would be; with a value it lands on the end of it.
     The label column is as wide as the longest label. 2 to 7 rows; the letters shrink as rows are added
     (label / value px: 2 rows 58 / 76, 3 rows 46 / 58, 4 rows 40 / 48, 5 or 6 rows 36 / 42, 7 rows 32 / 36), or set
     "sizes": [ 36, 42 ]. Two rows make a notice: { "label": "KICK-OFF", "value": "MONDAY" }, { "label": "TIME",
     "stamp": { .. } } (src/film/tbc/demo_board_pinned.json).

  3. "loop": two boxes joined by two curved arrows; a marker goes round for as long as the scene lasts.
     { "dur": 5.0, "scene": "loop", "file": "THE STUDY · FILE 03", "title": "HOW TO BUY A TICKET",
       "boxes": [ "BUY A TICKET", "REQUIRED: A TICKET BOUGHT BEFORE" ],
       "go": 0.5, "lap": 1.4, "counter": "ATTEMPT",
       "stamp": { "t": 4.7, "text": "NOT ELIGIBLE" } }
     "boxes": the top and the bottom box. Text before a colon is set as a small gold line above the rest
            ("REQUIRED:"). The top box takes about 14 characters at full size, the bottom about 24; longer text
            wraps and is made smaller until it fits (never under 30 px), so keep to about 30 characters a box.
     "go":  when the marker first leaves the top box (default 0.5). The top box is there from the first frame; the
            right arrow is drawn by the marker on its first way down, the bottom box appears as the marker reaches
            it, the left arrow is drawn on its first way back. After that only the marker moves.
     "lap": seconds for one full round (default 1.4). The marker reaches the bottom box at go + (k + 0.37) x lap
            and is back at the top box at go + (k + 0.87) x lap, k = 0, 1, 2 .. (the moments for a click); the box
            it reaches flashes red once, and the marker is out of sight inside the box until it leaves again.
     "counter": optional label of a lap counter under the loop ("ATTEMPT 1", then 2, 3 ..); it ticks each time the
            marker leaves the top box, at go + k x lap.
     "stamp": optional; lands across the loop between the boxes, and the marker keeps going underneath.

  4. "cards": names on cards in rows of three, turned over one at a time.
     { "dur": 6.4, "scene": "cards", "file": "THE STUDY · FILE 03", "title": "BALLOT FOR ONE TICKET",
       "names": [ "JO'S DAD", "LEE'S LANDLORD", "VIC'S FATHER-IN-LAW", "PRIYA'S BROTHER", "MARCUS'S NEIGHBOUR",
                  "MAYA'S COUSIN", "LEE'S SISTER", "VIC'S DENTIST", "DANNY'S GRANDMOTHER" ],
       "flips": [ 0.3, 0.6, 0.9, 1.2, 1.5, 1.8, 2.1, 2.4 ],
       "win": { "i": 8, "t": 3.1 },
       "note": { "t": 4.4, "text": "THE WINNER HAD NOT BEEN ASKED." } }
     "names": 3 to 12 strings (nine is the design). A name is broken after a first word that ends in 'S
              ("VIC'S" / "DENTIST"); write "\n" to choose the break yourself. Up to 13 characters a line.
     "flips": the times at which the losing cards turn over, one card per time, in reading order (the winner is
              skipped). A flip takes 0.25 s, around the vertical axis, and shows the name in grey over UNSUCCESSFUL.
              "order": [ 3, 0, 7, .. ] gives another order (indices into "names", 0 is the first).
     "win":   { "i": index of the winning name, "t": time }. That card turns over slowly (0.6 s from t), comes to
              the centre at about twice its size and shows the name large over a green SUCCESSFUL; the others all but
              vanish ("dim": how far, 0 to 1, default 0.93), so that no cut-off word beside the winner can be read.
     "lose" / "won": the two words on the backs (defaults "UNSUCCESSFUL" and "SUCCESSFUL").

  5. "week": a strip of days with tiles; each tile has its own row, so a tile that moves never crosses another.
     { "dur": 5.3, "scene": "week", "file": "THE STUDY · FILE 04", "title": "THE WEEKEND",
       "days": [ "FRI", "SAT", "SUN", "MON" ],
       "tiles": [
         { "label": "FLIGHT OUT",  "day": 0 },
         { "label": "THE MATCH",   "day": 1, "main": true, "move": { "t": 3.6, "to": 3 }, "tag": "MOVED" },
         { "label": "FLIGHT HOME", "day": 2, "clash": { "t": 4.6 } } ],
       "count": { "label": "DAYS BEFORE*", "sub": "*to be confirmed", "from": 40, "to": 42, "t": 4.2 },
       "stamp": { "t": 5.0, "text": "ARRIVED?" } }
     "days":  3 to 7 names. For dates under the names add "dates": [ "14", "15", "16", "17" ], or write each day as
              { "name": "FRI", "date": "14" }.
     tile:    "label"; "day" = index into "days" (0 is the first);
              "main": true = the gold tile (the match); the others are white with an ink outline;
              "pin": true  = drawn as a note with a red pin head (for "REACHED HIS SEAT");
              "t" = when the tile appears (omit: there on the first frame);
              "move": { "t", "to" } = slides to day "to" in 0.3 s from t and leaves a dashed outline where it was
                      (a list of moves is allowed: [ { "t": 1, "to": 2 }, { "t": 3, "to": 4 } ]);
              "tag": "MOVED" = a small red label on the tile, from the end of its first move (from the first
                      frame if the tile has no move, or at a time: "tag": { "text": "MOVED", "t": 2.0 });
              "clash": { "t" } = at t the tile turns red (red outline and letters) and swells once.
              1 to 4 tiles, one row each, in the order written. With 6 or 7 days the letters of the tiles fall
              under 30 px and each word of a label must be 6 letters or fewer: use 3 to 5 days for anything a
              viewer has to read.
     "count": a counter in the top right corner, in the place of the edit engine's day tag. "from" alone draws the
              number; with "to" and "t" the old number is struck through at t and the new one is written beside it.
              "sub" is the small line under it.
     "stamp": optional; lands across the tile rows, at the place nearest their middle where it covers least of
              the tiles (the tiles in their last positions).

  WHAT THIS PAGE DOES NOT DO: right-to-left layout (texts may be {"en","he"} but the page is laid out left to right);
  sound; any transition into or out of a scene.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Venuvoy · the study's paperwork (full-frame graphic scenes for the series)</title>
<style>
  @font-face { font-family: "Mont"; src: url(../../fonts/montserrat-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-hebrew-wght-normal.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  html, body { margin: 0; background: #0f2e21; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; color: #14201a;
    background: radial-gradient(ellipse 92% 62% at 50% 43%, #16392b 0%, #133426 58%, #0f2e21 100%);
    font-family: "JetBrains Mono", "DejaVu Sans Mono", "Heebo", monospace; font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0; }
  #grain { position: absolute; inset: 0; }
  #scene, #stamps, #guides { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #stamps, #guides { pointer-events: none; }

  /* the paper */
  .sheet { position: absolute; left: 48px; width: 984px; box-sizing: border-box; }
  .folder { position: absolute; left: 40px; width: 1000px; box-sizing: border-box; background: linear-gradient(180deg, #d6cab0, #cfc3a8); border-radius: 0 7px 5px 5px; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.36); }
  .folder .tab { position: absolute; left: 0; bottom: calc(100% - 1px); height: 54px; padding: 0 28px 0 26px; display: flex; align-items: center; background: #d6cab0; border-radius: 9px 12px 0 0;
    font-weight: 700; font-size: 30px; line-height: 1; letter-spacing: 0.06em; color: #3f4a43; white-space: nowrap; box-shadow: 0 -3px 8px rgba(0, 0, 0, 0.14); }
  .sheet.under { background: #e6dfcf; transform: rotate(-0.7deg) translate(3px, 5px); box-shadow: 0 3px 8px rgba(0, 0, 0, 0.2); }
  .sheet.doc { background: linear-gradient(180deg, #f6f1e5, #efe8d9); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22), 0 14px 34px rgba(0, 0, 0, 0.26); }
  .sheet.doc > .pg { position: absolute; inset: 0; mix-blend-mode: multiply; }
  .hd { position: absolute; left: 44px; right: 44px; top: 0; height: 78px; box-sizing: border-box; padding-bottom: 13px; display: flex; align-items: flex-end; justify-content: space-between; gap: 30px;
    border-bottom: 3px solid #14201a; font-weight: 800; font-size: 34px; line-height: 1; letter-spacing: 0.05em; color: #14201a; white-space: nowrap; }
  .hd::after { content: ""; position: absolute; left: 0; right: 0; bottom: -10px; height: 1px; background: rgba(20, 32, 26, 0.7); }

  .body.bare { top: 26px; }
  .ty { white-space: pre-line; }
  .ty .off { visibility: hidden; }
  .ty .on.u { padding-bottom: 7px; background: linear-gradient(#b0832a, #b0832a) no-repeat 0 100% / 0% 7px; -webkit-box-decoration-break: clone; box-decoration-break: clone; }

  /* a line of the file on the green field (cards) */
  .fline { position: absolute; left: 52px; right: 52px; height: 46px; display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; box-sizing: border-box;
    border-bottom: 2px solid rgba(230, 196, 122, 0.55); font-weight: 600; font-size: 30px; line-height: 1; letter-spacing: 0.06em; color: rgba(230, 196, 122, 0.82); white-space: nowrap; }
  .fline .tt { color: #e6c47a; font-weight: 700; }

  /* the note: one typed line on its own strip */
  .note { position: absolute; left: 48px; width: 984px; top: 1164px; height: 72px; box-sizing: border-box; background: linear-gradient(180deg, #f6f1e5, #efe8d9); box-shadow: 0 2px 5px rgba(0, 0, 0, 0.22), 0 10px 24px rgba(0, 0, 0, 0.26);
    display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 40px; line-height: 1; white-space: nowrap; transform-origin: 0 50%; }

  /* rows: checklist and list */
  .rows { position: absolute; inset: 0; display: flex; flex-direction: column; }

  .row:first-child .rule { display: none; }
  .ck .lb { flex: none; font-weight: 800; line-height: 1.1; white-space: nowrap; }
  .ck .ld { flex: 1 1 0; min-width: 0; height: 0; margin: 0 20px 0 22px; border-bottom: 5px dotted rgba(20, 32, 26, 0.36); transform: translateY(0.3em); }
  .ck .zone { flex: none; height: 10px; }
  .ls .lb { flex: none; font-weight: 700; line-height: 1.16; color: #55615a; white-space: nowrap; }
  .ls .vl { flex: 1 1 0; min-width: 0; font-weight: 800; line-height: 1.16; }
  .row.big { flex-grow: 1.4; }
  .ls .row.big { flex-grow: 1.55; }

  /* loop */
  .lp svg { position: absolute; left: 0; top: 0; overflow: visible; }
  .lp .bx { position: absolute; box-sizing: border-box; border: 5px solid #14201a; background: #fbf8f0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 18px; transform-origin: 50% 50%; }
  .lp .bx .k { font-weight: 700; font-size: 32px; letter-spacing: 0.1em; color: #b0832a; margin-bottom: 10px; line-height: 1; }
  .lp .bx .m { font-weight: 800; line-height: 1.1; white-space: pre-line; }
  .lp .bx .fl { position: absolute; inset: -5px; border: 9px solid #b3261e; opacity: 0; }
  .lp .ct { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 44px; line-height: 1; letter-spacing: 0.04em; color: #55615a; white-space: nowrap; }
  .lp .ct b { display: inline-block; min-width: 1.3em; text-align: left; margin-left: 0.4em; font-weight: 800; color: #14201a; transform-origin: 30% 60%; }

  /* cards */
  .card { position: absolute; transform-origin: 50% 50%; }
  .card .face { position: absolute; inset: 0; box-sizing: border-box; border-radius: 7px; display: flex; align-items: center; justify-content: center; text-align: center; padding: 10px 14px; box-shadow: 0 7px 18px rgba(0, 0, 0, 0.36); }
  .card .front { background: linear-gradient(180deg, #f6f1e5, #efe8d9); }
  .card .front::after { content: ""; position: absolute; inset: 9px; border: 2px solid rgba(20, 32, 26, 0.2); border-radius: 3px; }
  .card .back { background: #c9c5ba; color: #48534c; padding-bottom: 66px; }
  .card .back .st { position: absolute; left: 0; right: 0; bottom: 0; height: 58px; border-radius: 0 0 7px 7px; background: #55615a; color: #f4eee1; font: 800 30px/58px "Mont", "Heebo", sans-serif; letter-spacing: 0.06em; white-space: nowrap; }
  .card.win .back { background: linear-gradient(180deg, #faf6ec, #f2ecdf); color: #14201a; }
  .card.win .back .st { background: #1f7a4d; }
  .card .nm { font-weight: 800; line-height: 1.14; white-space: pre-line; }
  .card .sh { position: absolute; inset: 0; border-radius: 7px; background: #0b1410; opacity: 0; }

  /* week */
  .wk .dy { position: absolute; top: 0; text-align: center; }
  .wk .dy .n { font-weight: 800; line-height: 1; }
  .wk .dy .d { margin-top: 10px; font-weight: 600; font-size: 30px; line-height: 1; color: #55615a; }
  .wk .hr { position: absolute; left: 0; right: 0; height: 3px; background: #14201a; }
  .wk .cl { position: absolute; width: 2px; margin-left: -1px; background: rgba(20, 32, 26, 0.2); }
  .wk .ln { position: absolute; left: 0; right: 0; height: 2px; background: rgba(20, 32, 26, 0.12); }
  .wk .gh { position: absolute; box-sizing: border-box; border: 3px dashed rgba(20, 32, 26, 0.42); border-radius: 6px; }
  .wk .tl { position: absolute; box-sizing: border-box; border-radius: 6px; border: 4px solid #14201a; background: #fbf8f0; color: #14201a; display: flex; align-items: center; justify-content: center; text-align: center;
    font-weight: 800; line-height: 1.1; padding: 0 6px; transform-origin: 50% 50%; box-shadow: 0 4px 10px rgba(0, 0, 0, 0.16); }
  .wk .tl.main { background: #e9cd8b; }
  .wk .tl.hot { background: #f3d3ca; border-color: #b3261e; color: #b3261e; box-shadow: 0 0 0 2px #b3261e, 0 4px 10px rgba(0, 0, 0, 0.16); }
  .wk .tl.pin { border-width: 3px; }
  .wk .tl .ph { position: absolute; left: 50%; top: -19px; width: 30px; height: 30px; margin-left: -15px; border-radius: 50%; background: #b3261e; box-shadow: inset -4px -5px 0 rgba(0, 0, 0, 0.22), 0 3px 5px rgba(0, 0, 0, 0.3); }
  .wk .tl .tg { position: absolute; right: -12px; top: -30px; padding: 6px 12px 7px; background: #b3261e; color: #f8f3e8; font: 800 30px/1 "Mont", "Heebo", sans-serif; letter-spacing: 0.07em; white-space: nowrap; transform-origin: 80% 100%; box-shadow: 0 3px 8px rgba(0, 0, 0, 0.3); }
  .count { position: absolute; right: 40px; top: 264px; text-align: right; font-family: "Mont", "Heebo", sans-serif; color: #f4eee1; white-space: nowrap; }
  .count .l1 { display: flex; justify-content: flex-end; align-items: baseline; font-weight: 900; font-size: 46px; line-height: 1; }
  .count .old { position: relative; display: inline-block; }
  .count .old i { position: absolute; left: -5px; right: -5px; top: 46%; height: 6px; border-radius: 3px; background: #ea3d2c; transform: rotate(-9deg) scaleX(0); transform-origin: 0 50%; }
  .count .new { display: inline-block; overflow: hidden; text-align: right; vertical-align: baseline; transform-origin: 60% 70%; }
  .count .new b { display: inline-block; padding-left: 14px; font-weight: 900; }
  .count .lab { margin-left: 14px; font-weight: 800; font-size: 32px; letter-spacing: 0.06em; color: #e6c47a; }
  .count .l2 { margin-top: 7px; font-weight: 600; font-size: 24px; line-height: 1; letter-spacing: 0.03em; color: rgba(244, 238, 225, 0.74); }

  /* guides (checking only) */
  #guides div { position: absolute; left: 0; right: 0; box-sizing: border-box; }
</style>
</head>
<body>
<div id="stage">
  <div id="grain"></div>
  <div id="scene"></div>
  <div id="stamps"></div>
  <div id="guides"></div>
</div>
<script src="stamp.js"></script>
<script>
  // The script format is documented in the comment at the top of this file.
  const S = JSON.parse(new URLSearchParams(location.search).get("s") || "{}");
  const LANG = S.lang || "en";
  const tr = (v) => (v && typeof v === "object" && !Array.isArray(v) ? (v[LANG] ?? v.en ?? "") : (v ?? ""));
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const P = (t, t0, d) => clamp((t - t0) / d);
  const out = (x) => 1 - Math.pow(1 - x, 3);
  const io = (x) => 0.5 - 0.5 * Math.cos(Math.PI * clamp(x));
  const back = (x) => { const c = 1.7; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const scene = document.getElementById("scene"), stampLayer = document.getElementById("stamps");
  const el = (cls, parent, tag = "div") => { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; };
  const CPS = S.cps ?? 40;
  const TOP = 424, BOTTOM = S.note ? 1146 : 1236;   // the band the scene may use; the note strip takes the last 90 px

        const nm = el("n", c); nm.textContent = d.name; nm.style.fontSize = `${nameFs}px`;
        if (hasDates) el("d", c).textContent = d.date;
        if (i) { const l = el("cl", wrap); l.style.cssText = `left:${i * colW}px;top:${dayH + 10}px;height:${m * laneH}px`; }
      });
      const hr = el("hr", wrap); hr.style.top = `${dayH}px`;
      for (let j = 1; j < m; j++) el("ln", wrap).style.top = `${dayH + 10 + j * laneH}px`;
      const X = (day) => day * colW + (colW - tileW) / 2, Y = (j) => dayH + 10 + j * laneH + (laneH - tileH) / 2 + 4;
      const T = tiles.map((tl, j) => {
        const moves = [].concat(tl.move || []).slice().sort((a, b) => a.t - b.t);
        let gh = null;
        if (moves.length) { gh = el("gh", wrap); gh.style.cssText = `left:${X(tl.day)}px;top:${Y(j)}px;width:${tileW}px;height:${tileH}px`; }
        const e = el("tl" + (tl.main ? " main" : "") + (tl.pin ? " pin" : ""), wrap);
        e.style.cssText = `left:0;top:${Y(j)}px;width:${tileW}px;height:${tileH}px`;
        const label = String(tr(tl.label)), words = label.split(/\s+/), inner = tileW - 24;
        const fs = Math.max(24, Math.min(38, Math.floor(inner / (0.6 * Math.max(...words.map((w) => w.length))))));
        const sp = el("", e, "span"); sp.textContent = label; e.style.fontSize = `${fs}px`;
        if (tl.pin) el("ph", e);
        let tg = null;
        if (tl.tag) { e.style.paddingTop = "12px"; tg = el("tg", e); tg.textContent = String(tr(typeof tl.tag === "object" && "text" in tl.tag ? tl.tag.text : tl.tag)); }
        return { tl, e, gh, tg, moves, j };
      });
      let cnt = null;
      if (S.count) {
        const c = S.count, box = el("count", scene), l1 = el("l1", box);
        const old = el("old", l1, "span"); el("", old, "b").textContent = c.from; const strike = el("", old, "i");
        const nw = el("new", l1, "span"), nb = el("", nw, "b"); nb.textContent = c.to ?? "";
        el("lab", l1, "span").textContent = String(tr(c.label ?? ""));
        if (c.sub) el("l2", box).textContent = String(tr(c.sub));
        cnt = { c, old, strike, nw, nb, w: 0 };
      }
      const upNote = note();
      let st = null;
      return {
        layout() {
          if (cnt) cnt.w = cnt.nb.offsetWidth;
          if (S.stamp) {
            // the stamp lands across the tile rows, at the place nearest their middle where it covers least of the tiles
            const r = rect(wrap), paper = inset(rect(doc), 12);
            st = addStamp(S.stamp, { big: true, fit: Math.min(760, W * 0.7), max: 150 });
            const a = (Math.abs(st.rot) * Math.PI) / 180, hw = (st.w * Math.cos(a) + st.h * Math.sin(a)) / 2, hh = (st.w * Math.sin(a) + st.h * Math.cos(a)) / 2;
            const x0 = r.left + W / 2, y0 = r.top + dayH + 10 + (m * laneH) / 2, yMin = r.top + dayH + 4 + hh, yMax = Math.max(yMin, paper.bottom - hh);
            const boxes = T.map((k) => { const day = k.moves.length ? k.moves[k.moves.length - 1].to : k.tl.day, x = r.left + X(day), y = r.top + Y(k.j); return [x - 4, y - (k.tg || k.tl.pin ? 26 : 4), x + tileW + (k.tg ? 16 : 4), y + tileH + 4]; });
            let best = [x0, clamp(y0, yMin, yMax)], score = Infinity;
            for (let cx = paper.left + hw; cx <= paper.right - hw; cx += 10) for (let cy = yMin; cy <= yMax; cy += 10) {
              let v = 55 * (Math.abs(cx - x0) + Math.abs(cy - y0));
              for (const [bx0, by0, bx1, by1] of boxes) v += Math.max(0, Math.min(cx + hw, bx1) - Math.max(cx - hw, bx0)) * Math.max(0, Math.min(cy + hh, by1) - Math.max(cy - hh, by0));
              if (v < score) { score = v; best = [cx, cy]; }
            }
            place(st, best[0], best[1], paper);
          }
        },
        update(t) {
          for (const k of T) {
            let day = k.tl.day, land = null, started = false;
            for (const mv of k.moves) { const a = P(t, mv.t, 0.3); if (a > 0) started = true; day += (mv.to - day) * io(a); if (land == null) land = mv.t + 0.3; }
            const ap = k.tl.t == null ? 1 : P(t, k.tl.t, 0.18), cl = k.tl.clash ? P(t, k.tl.clash.t, 0.12) : 0, pulse = k.tl.clash ? Math.sin(Math.PI * P(t, k.tl.clash.t, 0.34)) : 0;
            k.e.style.visibility = ap > 0 ? "visible" : "hidden";
            k.e.style.opacity = Math.min(1, ap * 2);
            k.e.style.transform = `translate(${X(day).toFixed(1)}px, ${((1 - out(ap)) * -18).toFixed(1)}px) scale(${(1 + 0.08 * pulse).toFixed(4)})`;
            if (k.tl.clash) { k.e.classList.toggle("hot", cl > 0); k.e.style.zIndex = cl > 0 ? 5 : ""; }
            if (k.gh) k.gh.style.visibility = started ? "visible" : "hidden";
            if (k.tg) {
              const tt = (typeof k.tl.tag === "object" ? k.tl.tag.t : null) ?? (land == null ? -99 : land - 0.04), a = P(t, tt, 0.14);
              k.tg.style.visibility = a > 0 ? "visible" : "hidden";
              k.tg.style.transform = `rotate(4deg) scale(${(1.5 - 0.5 * out(a)).toFixed(3)})`;
              k.tg.style.opacity = Math.min(1, a * 2.5);
            }
          }
          if (cnt) {
            const c = cnt.c, has = c.to != null, a = has ? P(t, c.t ?? 0, 0.14) : 0, b = has ? P(t, (c.t ?? 0) + 0.12, 0.16) : 0;
            cnt.strike.style.transform = `rotate(-9deg) scaleX(${out(a)})`;
            cnt.old.style.opacity = 1 - 0.42 * a;
            cnt.nw.style.width = `${(cnt.w * out(b)).toFixed(1)}px`;
            cnt.nw.style.opacity = Math.min(1, b * 2);
          }
          upNote(t);
        },
      };
    },
  };

  const build = SCENES[S.scene];
  const sc = build ? build() : { layout() {}, update() {} };
  const upDocNote = S.scene === "cards" || S.scene === "week" || !build ? () => {} : note();

  if (S.guides) {
    const g = document.getElementById("guides");
    const band = (y0, y1, css) => { const d = el("", g); d.style.cssText = `top:${y0}px;height:${y1 - y0}px;${css}`; };
    band(1250, 1480, "background:rgba(255,0,200,0.22);border:2px solid #f0c");            // the caption lane
    band(262, 1588, "left:40px;right:40px;border:2px dashed rgba(0,220,255,0.8)");        // where everything that matters sits
    band(250, 1600, "border-top:2px solid #ff0;border-bottom:2px solid #ff0");            // the 4:5 crop
    band(262, 404, "left:620px;right:40px;background:rgba(255,160,0,0.22);border:2px solid #fa0");  // the day tag and the chip
  }

  window.seek = (t) => {
    let dx = 0, dy = 0;
    for (const s of stamps) { const u = t - s.t; Stamp.pose(s.el, u); const [a, b] = Stamp.shake(u, s.amp); dx += a; dy += b; }
    scene.style.transform = dx || dy ? `translate(${dx}px, ${dy}px)` : "none";
    sc.update(t);
    upDocNote(t);
  };
  window.__ready = Promise.all([document.fonts.ready, document.fonts.load('900 60px "Mont"'), document.fonts.load('800 60px "Mont"'), document.fonts.load('600 60px "Mont"')])
    .then(() => document.fonts.ready).then(() => { sc.layout(); window.seek(0); return true; });
</script>
</body>
</html>
