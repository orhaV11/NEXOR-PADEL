<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Venuvoy · the group chat (a full-frame scene for the series)</title>
<style>
  /* A group chat as a 1080x1920 picture, drawn frame by frame with seek(t) (render-chat.mjs films it).
     A generic messenger in the brand's colours, not a copy of any real app. The script arrives in the query
     string: ?s=<url-encoded JSON> (the format is documented above the script block).
     Rows 250-1600 hold everything that matters (the 4:5 crop). From the top: the header (to row 412; its right
     block, x 620-1040, keeps rows 262-338 empty for the edit engine's tag and holds the chip in rows 348-400),
     the pinned bar, the thread (it ends at row 1224, typing indicator included, and its right-hand column
     stops at x 956, clear of the phone apps' buttons), the caption lane (rows 1250-1480: background only)
     and the input bar (rows 1486-1582). */
  @font-face { font-family: "Mont"; src: url(../../fonts/montserrat-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-hebrew-wght-normal.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #0d2a1e; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #e9e2d4; font-family: "Heebo", "Mont", "Noto Color Emoji", sans-serif; color: #14201a; }
  /* everything that jolts when a stamp lands; the green and the paper run 40 px past the frame so no edge shows */
  #shk { position: absolute; inset: 0; }
  #paper { position: absolute; inset: -40px; background:
      radial-gradient(circle at 20px 20px, rgba(22, 57, 43, 0.07) 2.2px, transparent 2.6px) 0 0 / 54px 54px,
      radial-gradient(circle at 47px 47px, rgba(176, 131, 42, 0.07) 1.8px, transparent 2.2px) 0 0 / 54px 54px,
      linear-gradient(180deg, #ebe4d6, #e3dbcb); }

  /* header: the left block (x 40-606) holds the back arrow, the avatar, the name (two lines if it must) and the
     member count; the right block (x 620-1040) holds the chip, and its rows 262-338 belong to the edit engine */
  #head { position: absolute; left: -40px; right: -40px; top: -40px; height: 452px; background: linear-gradient(180deg, #0f2e21, #16392b); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); }
  #hin { position: absolute; left: 40px; top: 40px; width: 1080px; height: 412px; }
  #hin .row { position: absolute; inset-inline-start: 40px; top: 262px; width: 566px; height: 142px; display: flex; align-items: center; gap: 22px; }
  #hin .bk { flex: none; width: 30px; height: 30px; border-inline-start: 6px solid #e6c47a; border-bottom: 6px solid #e6c47a; transform: rotate(45deg); margin-inline: 14px -6px; }
  [dir="rtl"] #hin .bk { transform: rotate(-45deg); }
  #hin .av { flex: none; width: 104px; height: 104px; border-radius: 50%; background: #f4eee1; display: grid; place-items: center; }
  #hin .htx { flex: 1; min-width: 0; }
  #hin .nm { font-weight: 800; font-size: 44px; line-height: 1.08; color: #f4eee1; text-wrap: balance; }
  #hin .nm.one { font-size: 50px; line-height: 1.1; white-space: nowrap; }
  #hin .sb { margin-top: 4px; font-weight: 500; font-size: 32px; line-height: 1.2; color: rgba(244, 238, 225, 0.78); white-space: nowrap; }
  #hin .sb.typing { color: #e6c47a; }
  .chip { position: absolute; display: none; inset-inline-end: 40px; top: 348px; height: 52px; max-width: 420px; box-sizing: border-box; padding: 0 20px; overflow: hidden;
          border: 3px solid #e6c47a; border-radius: 10px; color: #e6c47a; font: 800 30px/46px "Mont", "Heebo", sans-serif; letter-spacing: 0.06em; white-space: nowrap; transform-origin: 100% 50%; }
  .chip.tag { top: 274px; }
  [dir="rtl"] .chip { letter-spacing: 0; transform-origin: 0 50%; }

  /* pinned bar: a strip under the header; the thread starts below it */
  #pin { position: absolute; display: none; left: -40px; right: -40px; top: 412px; height: 0; overflow: hidden; background: #f6f1e6; box-shadow: 0 5px 16px rgba(0, 0, 0, 0.2); }
  .pnl { position: absolute; left: 40px; top: 0; width: 1080px; box-sizing: border-box; padding: 18px 40px 20px; transform-origin: 40px 0; }
  .pnl .pb { position: relative; padding-inline-start: 28px; }
  .pnl .pb::before { content: ""; position: absolute; inset-inline-start: 0; top: 5px; bottom: 5px; width: 7px; border-radius: 4px; background: #b0832a; }
  .pnl .pk { display: flex; align-items: center; gap: 10px; font: 800 30px/38px "Mont", "Heebo", sans-serif; letter-spacing: 0.14em; text-transform: uppercase; color: #9a7020; }
  [dir="rtl"] .pnl .pk { letter-spacing: 0; }
  .pnl .pk svg { flex: none; width: 30px; height: 30px; }
  .pnl .pt { margin-top: 2px; font-weight: 600; font-size: 40px; line-height: 1.2; }
  .pnl .pt .ln { white-space: nowrap; }
  .pnl .pt.wrap .ln { white-space: normal; text-wrap: balance; }
  .pnl.big { padding: 28px 40px 34px; }
  .pnl.big .pb { padding-inline-start: 34px; }
  .pnl.big .pb::before { width: 9px; }
  .pnl.big .pk { font-size: 34px; line-height: 44px; gap: 12px; }
  .pnl.big .pk svg { width: 36px; height: 36px; }
  .pnl.big .pt { margin-top: 10px; font: 800 84px/1.14 "Mont", "Heebo", sans-serif; letter-spacing: -0.012em; }
  /* a gap left in the text for the stamp: a form's blank, dotted along the baseline */
  .pnl .slot { position: relative; display: inline-block; vertical-align: middle; width: 0; height: 0; }
  .pnl .slot::after { content: ""; position: absolute; left: 0.1em; right: 0.06em; top: calc(50% + 0.27em); height: 0.07em; min-height: 3px; opacity: var(--dots, 1);
                      background: radial-gradient(circle closest-side, rgba(20, 32, 26, 0.42) 92%, transparent) 0 0 / 0.26em 100% repeat-x; }

  /* the thread: a stack that grows from the bottom; older things leave under the header / the pinned bar */
  #msgs { position: absolute; left: 0; right: 0; top: 412px; height: 828px; overflow: hidden; }
  .it { position: absolute; max-width: 800px; will-change: transform; }
  .it.start { inset-inline-start: 40px; transform-origin: 0 0; }
  [dir="rtl"] .it.start { inset-inline-start: var(--right, 124px); transform-origin: 100% 0; }
  .it.end { inset-inline-end: var(--right, 124px); transform-origin: 100% 0; }
  [dir="rtl"] .it.end { inset-inline-end: 40px; transform-origin: 0 0; }
  .it.end > .bb { margin-inline-start: auto; }
  .it.mid { left: 50%; transform-origin: 50% 0; }
  .it.wide { left: 40px; width: 1000px; max-width: none; transform-origin: 50% 0; }
  .bb { width: fit-content; box-sizing: border-box; padding: 16px 26px 14px; border-radius: 26px; background: #fffdf8; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12); }
  .start .bb { border-start-start-radius: 8px; }
  .end .bb { background: #d7ecd2; border-start-end-radius: 8px; }
  .bb .who { font-weight: 800; font-size: 31px; line-height: 1.15; margin-bottom: 3px; white-space: nowrap; }
  .bb .who .nt { font-weight: 500; font-size: 30px; color: #6a756e; unicode-bidi: isolate; }
  .bb .who .nt::before { content: "·"; margin-inline: 11px; font-weight: 800; color: #9aa59e; }
  .bb .tx { font-weight: 500; font-size: 45px; line-height: 1.22; white-space: pre-line; overflow-wrap: anywhere; }
  .bb .ft { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 2px; font-weight: 500; font-size: 28px; line-height: 34px; color: #77827a; direction: ltr; }
  .bb .tk { width: 42px; height: 23px; }
  /* an attachment inside a bubble: a plain sheet glyph, a title and a line under it */
  .card { display: flex; align-items: center; gap: 20px; min-width: 470px; margin: 10px 0 8px; padding: 16px 26px 16px 18px; border-radius: 16px; background: #f3efe4; border: 2px solid rgba(22, 57, 43, 0.14); }
  .end .card { background: rgba(255, 253, 248, 0.74); border-color: rgba(22, 57, 43, 0.16); }
  .card svg { flex: none; width: 60px; height: 72px; }
  .card .ct { font-weight: 800; font-size: 42px; line-height: 1.12; }
  .card .cs { margin-top: 2px; font-weight: 500; font-size: 32px; line-height: 1.2; color: #55615a; }
  /* receipts: grey lines under a bubble, on its side ("Seen by 7", "Opened by 1"); the numbers are inked */
  .rc { box-sizing: border-box; overflow: hidden; padding-inline: 14px; }
  .end .rc { text-align: end; }
  .rc span { display: block; padding-top: 8px; font-weight: 600; font-size: 37px; line-height: 44px; color: #55615a; white-space: nowrap; }
  .rc b { font-weight: 800; color: #14201a; }
  .sys { padding: 10px 28px 12px; border-radius: 22px; background: rgba(22, 57, 43, 0.14); font-weight: 600; font-size: 35px; line-height: 44px; color: #2c3a33; white-space: nowrap; }
  .sys.day { background: rgba(255, 253, 248, 0.92); color: #55615a; font-weight: 700; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
  .dv { display: flex; align-items: center; gap: 24px; padding: 6px 0; font: 800 33px/44px "Mont", "Heebo", sans-serif; letter-spacing: 0.16em; text-transform: uppercase; color: #55615a; white-space: nowrap; }
  [dir="rtl"] .dv { letter-spacing: 0; }
  .dv::before, .dv::after { content: ""; flex: 1; height: 3px; border-radius: 2px; background: rgba(22, 57, 43, 0.24); }
  .poll { width: 772px; }
  .poll .q { font-weight: 800; font-size: 44px; line-height: 1.18; margin-bottom: 12px; }
  .poll .oi { padding-top: 14px; }
  .poll .l { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 40px; line-height: 1.3; }
  .poll .rd { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 4px solid #9aa59e; box-sizing: border-box; }
  .poll .op.lead .rd { border-color: #1f7a4d; background: radial-gradient(circle, #1f7a4d 0 46%, transparent 50%); }
  .poll .n { margin-inline-start: auto; font-weight: 800; font-size: 40px; color: #2c3a33; font-variant-numeric: tabular-nums; transform-origin: 100% 50%; }
  [dir="rtl"] .poll .n { transform-origin: 0 50%; }
  .poll .bar { margin-top: 8px; height: 12px; border-radius: 6px; background: #e4e0d6; overflow: hidden; }
  .end .poll .bar { background: rgba(22, 57, 43, 0.13); }
  .poll .ft { margin-top: 10px; }
  .poll .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: #1f7a4d; }
  .voice { display: flex; align-items: center; gap: 18px; width: 560px; direction: ltr; }
  .voice .pl { flex: none; width: 0; height: 0; border-left: 34px solid #16392b; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 6px; }
  .voice .wv { flex: 1; height: 62px; background: repeating-linear-gradient(90deg, #7f8c84 0 6px, transparent 6px 13px); -webkit-mask-image: linear-gradient(180deg, transparent 0 12%, #000 12% 88%, transparent 88%); border-radius: 4px;
               clip-path: polygon(0 40%, 6% 20%, 12% 55%, 18% 10%, 24% 45%, 30% 25%, 36% 60%, 42% 5%, 48% 40%, 54% 22%, 60% 58%, 66% 15%, 72% 48%, 78% 28%, 84% 62%, 90% 20%, 96% 45%, 100% 30%, 100% 70%, 96% 55%, 90% 80%, 84% 38%, 78% 72%, 72% 52%, 66% 85%, 60% 42%, 54% 78%, 48% 60%, 42% 95%, 36% 40%, 30% 75%, 24% 55%, 18% 90%, 12% 45%, 6% 80%, 0 60%); }
  .voice .du { flex: none; font-weight: 700; font-size: 34px; color: #55615a; }
  /* "Danny is typing…": the last thing in the thread. Not a message: a small pill of dots and grey words beside it */
  .tyb { position: absolute; display: flex; align-items: center; gap: 18px; height: 56px; inset-inline-start: 40px; transform-origin: 0 0; }
  [dir="rtl"] .tyb { inset-inline-start: var(--right, 124px); transform-origin: 100% 0; }
  .tyb .dots { flex: none; display: flex; align-items: center; justify-content: center; gap: 9px; width: 96px; height: 56px; border-radius: 28px; border-end-start-radius: 8px; background: rgba(255, 253, 248, 0.82); box-shadow: 0 2px 7px rgba(0, 0, 0, 0.09); }
  .tyb .dots i { width: 13px; height: 13px; border-radius: 50%; background: #55615a; }
  .tyb .w { font-weight: 500; font-size: 35px; line-height: 44px; color: #55615a; white-space: nowrap; }
  #bar { position: absolute; left: 36px; right: 36px; top: 1486px; height: 96px; border-radius: 48px; background: #fffdf8; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.14); display: flex; align-items: center; padding: 0 40px; font-weight: 500; font-size: 40px; color: #9aa59e; }
  #bar .mic { margin-inline-start: auto; width: 64px; height: 64px; border-radius: 50%; background: #16392b; }
  #stamps { position: absolute; inset: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="shk">
    <div id="paper"></div>
    <div id="msgs"></div>
    <div id="pin"></div>
    <div id="head"><div id="hin"><div class="row"><i class="bk"></i>
      <div class="av"><svg viewBox="0 0 64 64" width="78" height="78"><circle cx="17" cy="27" r="7" fill="#b89a55"/><path d="M3 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="47" cy="27" r="7" fill="#b89a55"/><path d="M33 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="32" cy="25" r="9" fill="#16392b"/><path d="M14 55c0-10 8-15 18-15s18 5 18 15z" fill="#16392b"/></svg></div>
      <div class="htx"><div class="nm" id="nm"></div><div class="sb" id="sb"></div></div></div></div></div>
    <div id="bar"><span id="ph"></span><i class="mic"></i></div>
  </div>
  <div id="stamps"></div>
</div>
<script src="stamp.js"></script>
<script>
  // THE SCRIPT  { dur, name, sub, placeholder?, right?, events: [ ... ] }
  //   node src/film/render-chat.mjs <script.json> <en|he> <out.mp4> [--still <t> <out.png>]   (it adds "lang")
  //   dur: seconds filmed. name, sub: the header ("Away trip – who's in?", "8 members"); a name too long for one
  //   line left of x 606 is set on two. placeholder: the input bar's grey word ("Message").
  //   right: the x where right-hand bubbles end. 956 by default, because phone apps put their buttons over
  //   x > 960 in rows 1050-1600; 1040 mirrors the left margin.
  //   Any text may be { "en": .., "he": .. }; "he" turns the whole screen right-to-left. Times are seconds.
  //   ALREADY ON SCREEN: an event whose t is <= 0 is there at frame 0, settled, with no entrance. The same
  //   holds for a receipt's t, a poll option's "at" and a vote. Things enter the thread in order of t.
  //   The chat is seen from one phone: "me": true puts a bubble on the right, in green, with ticks and no name.
  //
  // IN THE THREAD  (each thing opens at the bottom in 0.24 s and pushes the rest up; old ones leave under the
  //                 header or the pinned bar; the thread ends at row 1224 and nothing in it overlaps)
  //   { t, type: "msg", who, text, me?, time?, seen?, note?, card?, receipts? }
  //        a bubble. "\n" in text breaks the line. "time": "07:31", small, in its corner.
  //        "seen": 3.2          seconds at which its ticks turn blue ("me" bubbles only).
  //        "note": "02:07 his time"       small grey text after the sender's name: "Sydney · 02:07 his time"
  //                             (a "me" bubble shows no name, so no note).
  //        "card": { "title": "Trip plan", "sub": "spreadsheet" }       an attachment card under the text:
  //                             a sheet glyph, the title, the line under it ("sub" may be left out).
  //        "receipts": [ { "t": 18.2, "text": "Seen by 7" }, { "t": 19.1, "text": "Opened by 1" } ]
  //                             grey lines (37 px) under the bubble, on its side, one under another, each
  //                             sliding in at its own t while the thread makes room; numbers are inked.
  //        "voice" and "poll" take "note" and "receipts" in the same way.
  //   { t, type: "voice", who, len: "3:41", me?, time? }        a voice note
  //   { t, type: "poll", who, q, me?, time?, options: [ { text, votes?: [t, t, ...], at? } ] }
  //        each vote lands at its time (the count ticks, the bar fills); the option in the lead is marked. With
  //        "mine": true on one option, the filled dot stays on that option instead (the choice of the person whose
  //        phone this is) from its first vote on, and only counts and bars move. "dots": false on the poll: no filled
  //        dot at all (the owner has not voted).
  //        "at": 24.8           seconds at which this option is added: before that it is not there, then the
  //                             poll grows (0.3 s) and it arrives with an empty bar and takes votes like the
  //                             others. The line "Jo added an option: Should be fine" is a "sys" event that
  //                             you place yourself, usually at the same t.
  //   { t, type: "sys", text }                  a grey system line: "Danny left", "Maya added Danny"
  //   { t, type: "day", text }                  a date chip
  //   { t, type: "divider", text }              a rule across the thread with small capitals: "8 months later"
  //   { t, type: "space", h?: 120, len?: 0.5 }  an empty band of h pixels opens at the bottom of the thread in
  //                             len seconds: what is in the thread slides up a little, the typing indicator
  //                             stays where it is. Later messages arrive under the band.
  //   { t, type: "typingbar", who: "Danny", until?, text? }
  //        the typing indicator: the last thing in the thread, a small pill of three dots that pulse in a wave
  //        (one cycle a second) and the grey words "Danny is typing…" beside it ("text" replaces the words).
  //        Messages arrive above it and it never scrolls away. "until": seconds at which it goes.
  //        Several may run at once; the earliest sits lowest ("Vic is typing…" above "Danny is typing…").
  //
  // AROUND THE THREAD
  //   { t, type: "head", name?, sub? }          the header changes (a rename, "8 members")
  //   { t, type: "typing", who, len?: 1 }       the header's second line reads "X is typing…" for len seconds
  //   { t, type: "chip", text: "OWE MAYA: 6", slot? }
  //        a gold-outlined chip in the header's right block: rows 348-400, right edge at x 1040, never left
  //        of x 620. It pops in once and stays; a later "chip" replaces the text with a small tick.
  //        "slot": "tag"        a second chip in rows 274-326. Those rows belong to the edit engine's tag
  //                             ("96 DAYS BEFORE*"), so use it only on a screen where the engine draws none.
  //   { t, type: "pin", text, kicker?: "Pinned", big?, dim?, stamp? }
  //        the pinned bar under the header: a pin glyph, the kicker, the text. The thread starts below it.
  //        A later "pin" replaces it and the bar changes height smoothly. The text is one line (two if it
  //        does not fit); "\n" breaks the line where you say.
  //        "big": true          the bar becomes the subject of the screen: its text is set large (up to 84 px,
  //                             at most three lines) and the thread under it fades back.
  //        "dim": 0.5           how far the thread fades back, 0 to 1 (0.5 when big, otherwise 0).
  //        "stamp": { "t": 16.4, "text": "TO BE\nCONFIRMED", "on"?, "small"?, "size"?: 72, "rot"?: -6,
  //                   "color"?: "red", "opacity"?: 0.94, "dx"?: 0, "dy"?: 0 }
  //                             the series stamp (stamp.js) lands on the bar at t and the whole screen jolts
  //                             once (Stamp.shake; its vertical part is held to -5..+10 px so that nothing is
  //                             carried into the caption lane). "on" says where:
  //                               left out   the middle of the bar;
  //                               a number   the middle of that line of the text (1 is the first); the stamp
  //                                          then lies over words;
  //                               a name     a gap left in the text, written {name}:
  //                                          "text": "KICK-OFF: MONDAY\nTIME: {when}", "on": "when".
  //                                          The gap is a dotted blank as large as the stamp, so the stamp
  //                                          covers no word. This is the readable way.
  //                             dx, dy move it from there, in pixels. A stamp goes when its pin is replaced.
  //   { t, type: "stamp", text, small?, x?: 540, y?: 820, size?: 104, rot?: -8, color?: "red", opacity?: 0.94, until? }
  //        a free stamp, centred on x, y of the frame, with the jolt. It lies over the screen and does not
  //        scroll with the thread. "small": a second, small line. "color": "red" | "green" | "bright" | "ink".
  //        "until": seconds at which it is taken away.
  const S = JSON.parse(new URLSearchParams(location.search).get("s") || '{"events":[]}');
  const LANG = S.lang || "en", RTL = LANG === "he";
  const tr = (v) => (v && typeof v === "object" && !Array.isArray(v) ? (v[LANG] ?? v.en) : v);
  const stage = document.getElementById("stage");
  stage.dir = RTL ? "rtl" : "ltr";
  stage.style.setProperty("--right", `${1080 - (S.right ?? 956)}px`);
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const P = (t, t0, d) => clamp((t - t0) / d, 0, 1);
  const out = (x) => 1 - Math.pow(1 - x, 3);
  const io = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
  const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const T0 = (t) => (t == null || t <= 0 ? -1e4 : t);  // t <= 0: already there, settled
  const COLORS = ["#b0832a", "#1f7a6b", "#b3261e", "#6b4fa3", "#2a6fb0", "#c2571a", "#7a8c1f"];
  const people = {};
  const colorOf = (who) => (people[who] ??= COLORS[Object.keys(people).length % COLORS.length]);
  const TICK = (blue) => `<svg class="tk" viewBox="0 0 40 22"><path d="M2 12l7 7L24 3M15 16l3 3L33 3" fill="none" stroke="${blue ? "#2a8fd6" : "#9aa59e"}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const SHEET = `<svg viewBox="0 0 60 72"><path d="M7 2h30l21 21v41a6 6 0 0 1-6 6H7a6 6 0 0 1-6-6V8a6 6 0 0 1 6-6z" fill="#fffdf8" stroke="#16392b" stroke-width="3" stroke-linejoin="round"/><path d="M37 2v15a6 6 0 0 0 6 6h15" fill="#e4dfd2" stroke="#16392b" stroke-width="3" stroke-linejoin="round"/><rect x="11" y="32" width="38" height="9" fill="#e6c47a"/><path d="M11 32h38v28H11zM11 41h38M11 50.500h38M24 32v28M36.500 32v28" fill="none" stroke="#16392b" stroke-width="2.4"/></svg>`;
  const PIN = `<svg viewBox="0 0 24 24"><g transform="rotate(38 12 12)" fill="currentColor"><rect x="7" y="1.500" width="10" height="3.200" rx="1.300"/><path d="M9 4.500h6l1.300 6.500H7.700z"/><rect x="4.800" y="10.600" width="14.400" height="3.200" rx="1.600"/><rect x="11.100" y="13.500" width="1.800" height="9.500" rx="0.900"/></g></svg>`;
  const glue = (s) => String(s).replace(/ ([–—-]) /g, "\u00a0$1 ");  // "Away trip –" / "who's in?", never a line that starts with the dash
  const typingWords = (who) => (RTL ? `${who} מקליד/ה…` : `${who} is typing…`);

  const $ = (id) => document.getElementById(id);
  const msgs = $("msgs"), pinEl = $("pin"), hin = $("hin"), shk = $("shk"), stampsEl = $("stamps");
  const mk = (parent, cls, html = "") => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; parent.appendChild(el); return el; };
  const items = [], heads = [{ t: -1e4, name: tr(S.name), sub: tr(S.sub) }], typing = [], tbars = [], pins = [], chips = [], stamps = [];
  const addStamp = (o, extra) => { const s = { ...extra, t: o.t, el: Stamp.make(tr(o.text) ?? "", { small: tr(o.small), size: o.size, rot: o.rot, color: o.color, opacity: o.opacity }) }; stampsEl.appendChild(s.el); stamps.push(s); return s; };

  for (const e of (S.events || []).slice().sort((a, b) => (a.t || 0) - (b.t || 0))) {
    const t0 = T0(e.t), who = tr(e.who);
    if (e.type === "head") { heads.push({ t: t0, name: e.name != null ? tr(e.name) : undefined, sub: e.sub != null ? tr(e.sub) : undefined }); continue; }
    if (e.type === "typing") { typing.push({ t0: e.t, t1: e.t + (e.len ?? 1), who }); continue; }
    if (e.type === "typingbar") {
      tbars.push({ t0, t1: e.until ?? Infinity, el: mk(msgs, "tyb", `<span class="dots"><i></i><i></i><i></i></span><span class="w">${esc(tr(e.text) ?? typingWords(who))}</span>`) });
      continue;
    }
    if (e.type === "chip") { chips.push({ t0, slot: e.slot === "tag" ? "tag" : "", text: tr(e.text) }); continue; }
    if (e.type === "stamp") { addStamp({ size: 104, rot: -8, ...e, t: T0(e.t) }, { x: e.x ?? 540, y: e.y ?? 820, until: e.until ?? Infinity }); continue; }
    if (e.type === "pin") {
      const big = !!e.big, st = e.stamp;
      const lines = String(tr(e.text) ?? "").split("\n").map((l) => `<div class="ln">${esc(l).replace(/\{(\w+)\}/g, '<span class="slot" data-n="$1"></span>')}</div>`).join("");
      const el = mk(pinEl, "pnl" + (big ? " big" : ""), `<div class="pb"><div class="pk">${PIN}<span>${esc(tr(e.kicker) ?? (RTL ? "נעוץ" : "Pinned"))}</span></div><div class="pt">${lines}</div></div>`);
      const p = { t0, big, dim: e.dim ?? (big ? 0.5 : 0), el, H: 0 };
      if (st) p.stamp = addStamp({ size: 72, rot: -6, ...st, t: T0(st.t) }, { pin: p, on: st.on, dx: st.dx || 0, dy: st.dy || 0 });
      pins.push(p);
      continue;
    }
    if (e.type === "space") { items.push({ type: "space", t: t0, h: e.h ?? 120, len: e.len ?? 0.5, parts: [] }); continue; }
    const el = document.createElement("div"), parts = [];
    const side = e.me ? "end" : "start";
    const head = !e.me && who ? `<div class="who" style="color:${colorOf(who)}">${esc(who)}${e.note ? `<span class="nt">${esc(tr(e.note))}</span>` : ""}</div>` : "";
    const foot = (e.time || e.me) ? `<div class="ft"><span>${esc(e.time || "")}</span>${e.me ? `<span class="tks">${TICK(false)}</span>` : ""}</div>` : "";
    const card = e.card ? `<div class="card">${SHEET}<div><div class="ct">${esc(tr(e.card.title))}</div>${e.card.sub ? `<div class="cs">${esc(tr(e.card.sub))}</div>` : ""}</div></div>` : "";
    const rcs = (e.receipts || []).map((r) => `<div class="rc"><span>${esc(tr(r.text)).replace(/\d+/g, "<b>$&</b>")}</span></div>`).join("");
    if (e.type === "msg") { el.className = "it " + side; el.innerHTML = `<div class="bb">${head}<div class="tx">${esc(tr(e.text))}</div>${card}${foot}</div>${rcs}`; }
    else if (e.type === "voice") { el.className = "it " + side; el.innerHTML = `<div class="bb">${head}<div class="voice"><i class="pl"></i><i class="wv"></i><span class="du">${esc(e.len)}</span></div>${foot}</div>${rcs}`; }
    else if (e.type === "poll") {
      el.className = "it " + side;
      el.innerHTML = `<div class="bb poll">${head}<div class="q">${esc(tr(e.q))}</div>` + e.options.map((o) => `<div class="op"><div class="oi"><div class="l"><i class="rd"></i><span>${esc(tr(o.text))}</span><span class="n">0</span></div><div class="bar"><i></i></div></div></div>`).join("") + `${foot}</div>${rcs}`;
      el.querySelectorAll(".op").forEach((op, k) => { if (e.options[k].at > 0) parts.push({ el: op, t0: e.options[k].at, kind: "op" }); });
    } else if (e.type === "divider") { el.className = "it wide"; el.innerHTML = `<div class="dv"><span>${esc(tr(e.text))}</span></div>`; }
    else { el.className = "it mid"; el.innerHTML = `<div class="sys${e.type === "day" ? " day" : ""}">${esc(tr(e.text))}</div>`; }
    el.querySelectorAll(".rc").forEach((rc, k) => { if (e.receipts[k].t > 0) parts.push({ el: rc, t0: e.receipts[k].t, kind: "rc" }); });
    msgs.appendChild(el);
    items.push({ ...e, t: t0, el, parts });
  }
  const chipEls = { "": mk(hin, "chip"), tag: mk(hin, "chip tag") };
  $("ph").textContent = tr(S.placeholder) || (RTL ? "הודעה" : "Message");
  const nm = $("nm"), sb = $("sb");
  const GAP = 16, FLOOR = 812, TYH = 56;  // the thread's floor: nothing in it reaches below row 412 + 812 = 1224 (its box is cut off at row 1240)
  const nameFit = {};

  function fitName(name) {  // one line at 50 px if it stays left of x 606, else two lines (smaller if it must)
    nm.textContent = glue(name); nm.style.fontSize = ""; nm.className = "nm one";
    if (nm.scrollWidth <= nm.clientWidth) return { one: true };
    nm.className = "nm";
    let fs = 44;
    for (; fs > 30; fs -= 2) { nm.style.fontSize = `${fs}px`; if (nm.getBoundingClientRect().height < fs * 1.08 * 2.5 && nm.scrollWidth <= nm.clientWidth) break; }
    return { one: false, fs };
  }
  function fitPin(p) {  // size the text, then note the bar's height for this pin
    const pt = p.el.querySelector(".pt"), lns = [...pt.querySelectorAll(".ln")], lim = pt.clientWidth;
    const wide = () => Math.max(...lns.map((l) => l.scrollWidth)) > lim + 1;
    if (p.stamp && typeof p.stamp.on === "string") {  // the gap takes the stamp's (turned) size
      const slot = p.el.querySelector(`.slot[data-n="${p.stamp.on}"]`), el = p.stamp.el, r = Math.abs(+el.dataset.rot) * Math.PI / 180;
      el.style.display = "block"; el.style.transform = "none";
      const w = el.firstChild.offsetWidth, h = el.firstChild.offsetHeight;
      el.style.display = "none";
      if (slot) { slot.style.width = `${Math.ceil(w * Math.cos(r) + h * Math.sin(r)) + 12}px`; slot.style.height = `${Math.ceil(w * Math.sin(r) + h * Math.cos(r)) + 16}px`; }
    }
    let fs = p.big ? 84 : 40;
    const min = p.big ? 46 : 34;
    for (; fs > min; fs -= 2) { pt.style.fontSize = `${fs}px`; if (!wide()) break; }
    pt.style.fontSize = `${fs}px`;
    if (wide()) {  // still too long for its lines: let it wrap (two lines; three when big)
      pt.classList.add("wrap");
      const most = p.big ? 3 : 2, rows = () => Math.round(pt.getBoundingClientRect().height / (fs * (p.big ? 1.14 : 1.2)));
      for (fs = p.big ? 84 : 40; fs > 30; fs -= 2) { pt.style.fontSize = `${fs}px`; if (rows() <= most) break; }
    }
    p.H = p.el.getBoundingClientRect().height;
  }

  window.seek = (t) => {
    // header
    let h = heads[0];
    for (const x of heads) if (t >= x.t) h = { name: x.name ?? h.name, sub: x.sub ?? h.sub };
    const ty = typing.find((x) => t >= x.t0 && t < x.t1);
    const nf = nameFit[h.name || ""] || { one: true };
    nm.textContent = glue(h.name || "");
    nm.className = "nm" + (nf.one ? " one" : "");
    nm.style.fontSize = nf.one ? "" : `${nf.fs}px`;
    sb.textContent = ty ? typingWords(ty.who) : (h.sub || "");
    sb.className = "sb" + (ty ? " typing" : "");
    for (const slot of ["", "tag"]) {
      const el = chipEls[slot], mine = chips.filter((c) => c.slot === slot && t >= c.t0);
      if (!mine.length) { el.style.display = "none"; continue; }
      const c = mine[mine.length - 1], a = P(t, c.t0, 0.22);
      el.style.display = "block";
      el.textContent = c.text;
      el.style.opacity = mine.length > 1 ? 1 : Math.min(1, a * 2.5);
      el.style.transform = `scale(${mine.length > 1 ? 1 + 0.1 * (1 - out(a)) : 0.72 + 0.28 * back(a)})`;
    }

    // pinned bar: its height, which of its texts shows, how far the thread under it fades back
    let pinH = 0, dim = 0, cur = -1;
    for (let k = 0; k < pins.length; k++) if (t >= pins[k].t0) cur = k;
    for (const p of pins) p.el.style.display = "none";
    if (cur >= 0) {
      const c = pins[cur], prev = pins[cur - 1], D = c.big || (prev && prev.big) ? 0.5 : 0.3;
      const p = P(t, c.t0, D), e = c.big || (prev && prev.big) ? io(p) : out(p);
      pinH = (prev ? prev.H : 0) + (c.H - (prev ? prev.H : 0)) * e;
      dim = (prev ? prev.dim : 0) + (c.dim - (prev ? prev.dim : 0)) * e;
      c.el.style.display = "block";
      c.el.style.opacity = prev ? P(t, c.t0 + D * 0.18, D * 0.5) : Math.min(1, p * 2);
      c.el.style.transform = prev ? `translateY(${(1 - e) * 10}px)` : `translateY(${(e - 1) * c.H * 0.4}px)`;
      if (prev && p < 1) { prev.el.style.display = "block"; prev.el.style.opacity = 1 - P(t, c.t0, D * 0.3); prev.el.style.transform = "none"; }
    }
    pinEl.style.display = pinH > 0 ? "block" : "none";
    pinEl.style.height = `${pinH}px`;
    msgs.style.opacity = 1 - dim;
    msgs.style.webkitMaskImage = msgs.style.maskImage = `linear-gradient(180deg, transparent ${pinH + 6}px, #000 ${pinH + 52}px)`;

    // the thread, from its floor upwards: the typing indicators, then the newest item, then the older ones
    let y = FLOOR;
    for (const [n, b] of tbars.entries()) {
      if (t < b.t0 || t >= b.t1 + 0.2) { b.el.style.display = "none"; continue; }
      const a = P(t, b.t0, 0.24), g = out(a) * (1 - P(t, b.t1, 0.2));
      y -= TYH * g;
      b.el.style.display = "flex";
      b.el.style.top = `${y}px`;
      b.el.style.opacity = Math.min(1, a * 2.2) * (1 - P(t, b.t1, 0.2));
      b.el.style.transform = `scale(${Math.max(0.001, g)})`;  // never taller than the room made for it
      b.el.querySelectorAll("i").forEach((d, k) => {  // a wave that repeats every second (24 frames); two people do not type in step
        const ph = (((t - k * 0.16 - n * 0.42) % 1) + 1) % 1, w = ph < 0.5 ? Math.sin(Math.PI * ph / 0.5) : 0;
        d.style.transform = `translateY(${-8 * w}px)`;
        d.style.opacity = 0.34 + 0.66 * w;
      });
      y -= GAP * g;
    }
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (it.type === "space") { y -= it.h * io(P(t, it.t, it.len)); continue; }
      if (t < it.t) { it.el.style.visibility = "hidden"; continue; }
      const a = P(t, it.t, 0.24), e = out(a);
      let ih = it.h0;
      for (const pt of it.parts) {  // a receipt or a late poll option opening up
        const pa = P(t, pt.t0, 0.3), g = out(pa);
        ih += pt.H * g;
        pt.el.style.height = `${pt.H * g}px`;
        pt.el.style.overflow = pa < 1 ? "hidden" : "";
        pt.el.style.opacity = pt.kind === "rc" ? P(t, pt.t0 + 0.04, 0.2) : P(t, pt.t0 + 0.08, 0.22);
        if (pt.kind === "rc") pt.el.firstChild.style.transform = `translateY(${(g - 1) * 22}px)`;
      }
      const top = (y -= ih * e);
      y -= GAP * e;
      if (top + ih < pinH - 40) { it.el.style.visibility = "hidden"; continue; }  // gone under the header
      it.el.style.visibility = "visible";
      it.el.style.top = `${top}px`;
      it.el.style.opacity = Math.min(1, a * 2.2);
      it.el.style.transform = (it.el.classList.contains("mid") ? "translateX(-50%) " : "") + `scale(${Math.max(0.001, e)})`;  // it grows inside the room made for it, so it never covers its neighbours
      if (it.type === "poll") {
        const votes = it.options.map((o) => (o.votes || []).map(T0)), counts = votes.map((v) => v.filter((x) => t >= x).length);
        const most = Math.max(1, ...counts), lead = Math.max(...counts);
        it.el.querySelectorAll(".op").forEach((op, k) => {
          const last = Math.max(-1e4, ...votes[k].filter((v) => t >= v));
          op.querySelector(".n").textContent = counts[k];
          op.querySelector(".bar i").style.width = `${(Math.max(0, counts[k] - 1 + out(P(t, last, 0.3))) / Math.max(most, 3)) * 100}%`;
          // the filled dot is the phone owner's own choice when the script names one ("mine": true on an option); otherwise the leader
          const own = it.options.some((o) => o.mine);
          op.classList.toggle("lead", it.dots === false ? false : own ? !!it.options[k].mine && counts[k] > 0 : lead > 0 && counts[k] === lead);
          op.querySelector(".n").style.transform = `scale(${1 + 0.35 * (1 - P(t, last, 0.25))})`;
        });
      }
      if (it.me && it.seen != null) { const tk = it.el.querySelector(".tks"); if (tk) tk.innerHTML = TICK(t >= it.seen); }
    }

    // stamps (they do not jolt; everything under them does)
    let dx = 0, dy = 0;
    const base = shk.getBoundingClientRect();
    for (const s of stamps) {
      let u = t - s.t;
      if (s.pin) {
        if (pins[cur] !== s.pin) u = -1;
        else {
          const on = typeof s.on === "number" ? s.pin.el.querySelectorAll(".ln")[s.on - 1] : typeof s.on === "string" ? s.pin.el.querySelector(`.slot[data-n="${s.on}"]`) : null;
          const r = (on || s.pin.el).getBoundingClientRect();
          if (typeof s.on === "string" && on) on.style.setProperty("--dots", u >= 0.04 ? 0 : 1);  // the ink covers the dotted blank
          s.el.style.left = `${r.left - base.left + r.width / 2 + s.dx}px`;
          s.el.style.top = `${(on ? r.top + r.height / 2 : pinEl.getBoundingClientRect().top + s.pin.H / 2) - base.top + s.dy}px`;
        }
      } else {
        if (t >= s.until) u = -1;
        s.el.style.left = `${s.x}px`;
        s.el.style.top = `${s.y}px`;
      }
      Stamp.pose(s.el, u);
      const [sx, sy] = Stamp.shake(u);
      dx += sx; dy += sy;
    }
    dy = clamp(dy, -5, 10);  // the jolt may not carry the input bar or the thread into the caption lane
    shk.style.transform = dx || dy ? `translate(${dx}px, ${dy}px)` : "none";
  };

  window.__ready = Promise.all([document.fonts.load('900 40px "Mont"'), document.fonts.load('800 40px "Heebo"')]).then(() => document.fonts.ready).then(() => {
    for (const x of heads) if (x.name != null && !nameFit[x.name]) nameFit[x.name] = fitName(x.name);
    pinEl.style.display = "block";
    for (const p of pins) fitPin(p);
    for (const it of items) {
      if (!it.el) continue;
      const full = it.el.getBoundingClientRect().height;
      for (const pt of it.parts) pt.H = pt.el.getBoundingClientRect().height;
      it.h0 = full - it.parts.reduce((s, pt) => s + pt.H, 0);
    }
    seek(0);
  });
</script>
</body>
</html>
