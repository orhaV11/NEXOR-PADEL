<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Venuvoy · the group chat (a full-frame scene for the series)</title>
<style>
  /* A group chat as a 1080x1920 picture, drawn frame by frame with seek(t) (render-chat.mjs films it).
     A generic messenger in the brand's colours, not a copy of any real app. The script arrives in the query
     string: ?s=<url-encoded JSON> (see the comment above the script block). Rows 250-1600 hold everything
     that matters (the 4:5 crop), and rows 1250-1470 are left clear for the narrator's caption. */
  @font-face { font-family: "Mont"; src: url(../../fonts/montserrat-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-hebrew-wght-normal.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; background: #0d2a1e; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #e9e2d4; font-family: "Heebo", "Mont", "Noto Color Emoji", sans-serif; color: #14201a; }
  #paper { position: absolute; inset: 0; background:
      radial-gradient(circle at 20px 20px, rgba(22, 57, 43, 0.07) 2.2px, transparent 2.6px) 0 0 / 54px 54px,
      radial-gradient(circle at 47px 47px, rgba(176, 131, 42, 0.07) 1.8px, transparent 2.2px) 0 0 / 54px 54px,
      linear-gradient(180deg, #ebe4d6, #e3dbcb); }
  #head { position: absolute; left: 0; right: 0; top: 0; height: 412px; background: linear-gradient(180deg, #0f2e21, #16392b); box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28); }
  #head .row { position: absolute; inset-inline: 44px; top: 268px; display: flex; align-items: center; gap: 26px; }
  #head .bk { flex: none; width: 34px; height: 34px; border-inline-start: 6px solid #e6c47a; border-bottom: 6px solid #e6c47a; transform: rotate(45deg); margin-inline-start: 10px; }
  [dir="rtl"] #head .bk { transform: rotate(-45deg); }
  #head .av { flex: none; width: 112px; height: 112px; border-radius: 50%; background: #f4eee1; display: grid; place-items: center; }
  #head .nm { font-weight: 800; font-size: 50px; line-height: 1.1; color: #f4eee1; white-space: nowrap; }
  #head .sb { margin-top: 4px; font-weight: 500; font-size: 33px; color: rgba(244, 238, 225, 0.78); white-space: nowrap; }
  #head .sb.typing { color: #e6c47a; }
  #msgs { position: absolute; left: 0; right: 0; top: 432px; height: 808px; overflow: hidden;
          -webkit-mask-image: linear-gradient(180deg, transparent 0, #000 46px); mask-image: linear-gradient(180deg, transparent 0, #000 46px); }
  .it { position: absolute; max-width: 800px; will-change: transform; }
  .it.start { inset-inline-start: 40px; transform-origin: 0 100%; }
  [dir="rtl"] .it.start { transform-origin: 100% 100%; }
  .it.end { inset-inline-end: 40px; transform-origin: 100% 100%; }
  [dir="rtl"] .it.end { transform-origin: 0 100%; }
  .it.mid { left: 50%; transform-origin: 50% 100%; }
  .bb { padding: 16px 26px 14px; border-radius: 26px; background: #fffdf8; box-shadow: 0 3px 10px rgba(0, 0, 0, 0.12); }
  .start .bb { border-start-start-radius: 8px; }
  .end .bb { background: #d7ecd2; border-start-end-radius: 8px; }
  .bb .who { font-weight: 800; font-size: 31px; line-height: 1.15; margin-bottom: 3px; }
  .bb .tx { font-weight: 500; font-size: 45px; line-height: 1.22; white-space: pre-line; overflow-wrap: anywhere; }
  .bb .ft { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 2px; font-weight: 500; font-size: 25px; color: #7b857e; direction: ltr; }
  .bb .tk { width: 40px; height: 22px; }
  .sys { padding: 10px 28px 12px; border-radius: 22px; background: rgba(22, 57, 43, 0.14); font-weight: 600; font-size: 33px; color: #2c3a33; white-space: nowrap; }
  .sys.day { background: rgba(255, 253, 248, 0.92); color: #55615a; font-weight: 700; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); }
  .poll { width: 720px; }
  .poll .q { font-weight: 800; font-size: 44px; line-height: 1.18; margin-bottom: 12px; }
  .poll .op { margin-top: 14px; }
  .poll .l { display: flex; align-items: center; gap: 16px; font-weight: 600; font-size: 40px; }
  .poll .rd { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 4px solid #9aa59e; box-sizing: border-box; }
  .poll .op.lead .rd { border-color: #1f7a4d; background: radial-gradient(circle, #1f7a4d 0 46%, transparent 50%); }
  .poll .n { margin-inline-start: auto; font-weight: 800; font-size: 38px; color: #2c3a33; }
  .poll .bar { margin-top: 8px; height: 12px; border-radius: 6px; background: #e4e0d6; overflow: hidden; }
  .poll .bar i { display: block; height: 100%; width: 0; border-radius: 6px; background: #1f7a4d; }
  .voice { display: flex; align-items: center; gap: 18px; width: 560px; direction: ltr; }
  .voice .pl { flex: none; width: 0; height: 0; border-left: 34px solid #16392b; border-top: 22px solid transparent; border-bottom: 22px solid transparent; margin-left: 6px; }
  .voice .wv { flex: 1; height: 62px; background: repeating-linear-gradient(90deg, #7f8c84 0 6px, transparent 6px 13px); -webkit-mask-image: linear-gradient(180deg, transparent 0 12%, #000 12% 88%, transparent 88%); border-radius: 4px;
               clip-path: polygon(0 40%, 6% 20%, 12% 55%, 18% 10%, 24% 45%, 30% 25%, 36% 60%, 42% 5%, 48% 40%, 54% 22%, 60% 58%, 66% 15%, 72% 48%, 78% 28%, 84% 62%, 90% 20%, 96% 45%, 100% 30%, 100% 70%, 96% 55%, 90% 80%, 84% 38%, 78% 72%, 72% 52%, 66% 85%, 60% 42%, 54% 78%, 48% 60%, 42% 95%, 36% 40%, 30% 75%, 24% 55%, 18% 90%, 12% 45%, 6% 80%, 0 60%); }
  .voice .du { flex: none; font-weight: 700; font-size: 34px; color: #55615a; }
  #bar { position: absolute; left: 36px; right: 36px; top: 1486px; height: 96px; border-radius: 48px; background: #fffdf8; box-shadow: 0 3px 12px rgba(0, 0, 0, 0.14); display: flex; align-items: center; padding: 0 40px; font-weight: 500; font-size: 40px; color: #9aa59e; }
  #bar .mic { margin-inline-start: auto; width: 64px; height: 64px; border-radius: 50%; background: #16392b; }
</style>
</head>
<body>
<div id="stage">
  <div id="paper"></div>
  <div id="msgs"></div>
  <div id="head"><div class="row"><i class="bk"></i>
    <div class="av"><svg viewBox="0 0 64 64" width="84" height="84"><circle cx="17" cy="27" r="7" fill="#b89a55"/><path d="M3 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="47" cy="27" r="7" fill="#b89a55"/><path d="M33 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="32" cy="25" r="9" fill="#16392b"/><path d="M14 55c0-10 8-15 18-15s18 5 18 15z" fill="#16392b"/></svg></div>
    <div><div class="nm" id="nm"></div><div class="sb" id="sb"></div></div></div></div>
  <div id="bar"><span id="ph"></span><i class="mic"></i></div>
</div>
<script>
  // Script: { lang: "he"|"en", dur, name, sub, placeholder?, events: [ ... ] }  (any text may be {"en": .., "he": ..})
  //   { t, type: "msg",   who, text, me?, time?, seen? }      a bubble; "seen": seconds at which its ticks turn blue
  //   { t, type: "voice", who, len: "3:41", me?, time? }      a voice note
  //   { t, type: "poll",  who, q, options: [{ text, votes: [t, t, ...] }], time? }
  //   { t, type: "sys",   text }                              "Danny left", "Omer changed the group name"
  //   { t, type: "day",   text }                              a date chip
  //   { t, type: "typing", who, len }                         the header says who is typing
  //   { t, type: "head",  name?, sub? }                       the header changes (a rename, a member count)
  const S = JSON.parse(new URLSearchParams(location.search).get("s") || '{"events":[]}');
  const LANG = S.lang || "en", RTL = LANG === "he";
  const tr = (v) => (v && typeof v === "object" && !Array.isArray(v) ? (v[LANG] ?? v.en) : v);
  const stage = document.getElementById("stage");
  stage.dir = RTL ? "rtl" : "ltr";
  const esc = (s) => String(s ?? "").replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
  const P = (t, t0, d) => clamp((t - t0) / d, 0, 1);
  const out = (x) => 1 - Math.pow(1 - x, 3);
  const back = (x) => { const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
  const COLORS = ["#b0832a", "#1f7a6b", "#b3261e", "#6b4fa3", "#2a6fb0", "#c2571a", "#7a8c1f"];
  const people = {};
  const colorOf = (who) => (people[who] ??= COLORS[Object.keys(people).length % COLORS.length]);
  const TICK = (blue) => `<svg class="tk" viewBox="0 0 40 22"><path d="M2 12l7 7L24 3M15 16l3 3L33 3" fill="none" stroke="${blue ? "#2a8fd6" : "#9aa59e"}" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const msgs = document.getElementById("msgs");
  const items = [], heads = [{ t: -1, name: tr(S.name), sub: tr(S.sub) }], typing = [];
  for (const e of (S.events || []).slice().sort((a, b) => a.t - b.t)) {
    if (e.type === "head") { heads.push({ t: e.t, name: e.name != null ? tr(e.name) : undefined, sub: e.sub != null ? tr(e.sub) : undefined }); continue; }
    if (e.type === "typing") { typing.push({ t0: e.t, t1: e.t + (e.len ?? 1), who: tr(e.who) }); continue; }
    const el = document.createElement("div");
    const who = tr(e.who);
    const head = !e.me && who ? `<div class="who" style="color:${colorOf(who)}">${esc(who)}</div>` : "";
    const foot = (e.time || e.me) ? `<div class="ft"><span>${esc(e.time || "")}</span>${e.me ? `<span class="tks">${TICK(false)}</span>` : ""}</div>` : "";
    if (e.type === "msg") { el.className = "it " + (e.me ? "end" : "start"); el.innerHTML = `<div class="bb">${head}<div class="tx">${esc(tr(e.text))}</div>${foot}</div>`; }
    else if (e.type === "voice") { el.className = "it " + (e.me ? "end" : "start"); el.innerHTML = `<div class="bb">${head}<div class="voice"><i class="pl"></i><i class="wv"></i><span class="du">${esc(e.len)}</span></div>${foot}</div>`; }
    else if (e.type === "poll") {
      el.className = "it " + (e.me ? "end" : "start");
      el.innerHTML = `<div class="bb poll">${head}<div class="q">${esc(tr(e.q))}</div>` + e.options.map((o) => `<div class="op"><div class="l"><i class="rd"></i><span>${esc(tr(o.text))}</span><span class="n">0</span></div><div class="bar"><i></i></div></div>`).join("") + `${foot}</div>`;
    } else { el.className = "it mid"; el.innerHTML = `<div class="sys${e.type === "day" ? " day" : ""}">${esc(tr(e.text))}</div>`; }
    msgs.appendChild(el);
    items.push({ ...e, el });
  }
  document.getElementById("ph").textContent = tr(S.placeholder) || (RTL ? "הודעה" : "Message");
  const nm = document.getElementById("nm"), sb = document.getElementById("sb");
  const GAP = 16, AREA = 808;

  window.seek = (t) => {
    let h = heads[0];
    for (const x of heads) if (t >= x.t) h = { name: x.name ?? h.name, sub: x.sub ?? h.sub };
    const ty = typing.find((x) => t >= x.t0 && t < x.t1);
    nm.textContent = h.name || "";
    sb.textContent = ty ? (RTL ? `${ty.who} מקליד/ה…` : `${ty.who} is typing…`) : (h.sub || "");
    sb.className = "sb" + (ty ? " typing" : "");
    let y = AREA - 14;
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      if (t < it.t) { it.el.style.visibility = "hidden"; continue; }
      const a = P(t, it.t, 0.24), e = out(a);
      y -= (it.h + GAP) * e;
      it.el.style.visibility = "visible";
      it.el.style.top = `${y}px`;
      it.el.style.opacity = Math.min(1, a * 2.2);
      it.el.style.transform = (it.el.classList.contains("mid") ? "translateX(-50%) " : "") + `scale(${0.86 + 0.14 * back(a)})`;
      if (it.type === "poll") {
        const counts = it.options.map((o) => (o.votes || []).filter((v) => t >= v).length);
        const top = Math.max(1, ...counts), lead = Math.max(...counts);
        it.el.querySelectorAll(".op").forEach((op, k) => {
          const last = Math.max(-9, ...(it.options[k].votes || []).filter((v) => t >= v));
          op.querySelector(".n").textContent = counts[k];
          op.querySelector(".bar i").style.width = `${(Math.max(0, counts[k] - 1 + out(P(t, last, 0.3))) / Math.max(top, 3)) * 100}%`;
          op.classList.toggle("lead", lead > 0 && counts[k] === lead);
          op.querySelector(".n").style.transform = `scale(${1 + 0.35 * (1 - P(t, last, 0.25))})`;
        });
      }
      if (it.me && it.seen != null) { const tk = it.el.querySelector(".tks"); if (tk) tk.innerHTML = TICK(t >= it.seen); }
    }
  };
  window.__ready = document.fonts.ready.then(() => { for (const it of items) it.h = it.el.getBoundingClientRect().height; seek(0); });
</script>
</body>
</html>
