<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Venuvoy · film overlay (captions, lower thirds, stickers)</title>
<style>
  /* A transparent 1080x1920 layer for the AI-shot films, rendered frame by frame with seek(t) and composited
     over the cut: word-by-word captions the way people caption their own videos, documentary lower thirds,
     and big text stickers. The timeline arrives in the query string (?tl=<url-encoded JSON>). */
  @font-face { font-family: "Mont"; src: url(../../fonts/montserrat-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-hebrew-wght-normal.woff2) format("woff2"); font-weight: 100 900; unicode-range: U+0590-05FF, U+200C-2010, U+20AA, U+25CC, U+FB1D-FB4F; }
  @font-face { font-family: "Heebo"; src: url(../../fonts/heebo-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Playfair"; src: url(../../fonts/playfair-display-latin-wght-italic.woff2) format("woff2"); font-weight: 400 900; font-style: italic; }
  @font-face { font-family: "Playfair"; src: url(../../fonts/playfair-display-latin-wght-normal.woff2) format("woff2"); font-weight: 400 900; font-style: normal; }
  @font-face { font-family: "FrankRuhl"; src: url(../../fonts/frank-ruhl-libre-hebrew-wght-normal.woff2) format("woff2"); font-weight: 300 900; }
  html, body { margin: 0; background: transparent; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: "Mont", "Heebo", sans-serif; }
  [dir="rtl"] #stage { font-family: "Heebo", "Mont", sans-serif; }

  /* captions: two or three words at a time, the spoken word lit in gold */
  .fx-cap { position: absolute; left: 100px; right: 140px; display: none; text-align: center; font-weight: 900; font-size: 86px; line-height: 1.08;
    letter-spacing: -0.01em; text-transform: uppercase; color: #fff; -webkit-text-stroke: 14px #0b0d0c; paint-order: stroke fill;
    filter: drop-shadow(0 8px 0 rgba(0, 0, 0, 0.35)); }
  [dir="rtl"] .fx-cap { font-size: 92px; letter-spacing: 0; -webkit-text-stroke-width: 13px; text-wrap: balance; }
  .fx-cap span { display: inline-block; margin: 0 0.13em; transform-origin: 50% 70%; }
  .fx-cap span.on { color: #ffd66b; }
  /* a chorus (the whole room speaking): cream italics, sentence case */
  .fx-cap.chorus { font-family: "Playfair", "Heebo", serif; font-style: italic; font-weight: 800; font-size: 82px; text-transform: none; letter-spacing: 0; color: #f4eee1; -webkit-text-stroke-width: 12px; }
  [dir="rtl"] .fx-cap.chorus { font-family: "FrankRuhl", "Heebo", serif; font-style: normal; font-weight: 800; font-size: 90px; }
  .fx-cap.chorus span.on { color: #f4eee1; }
  /* the narrator: serif italics in sentence case, no word highlight (a voice from outside the scene) */
  .fx-cap.nar { left: 0; right: 0; width: fit-content; max-width: 860px; margin: 0 auto; padding: 14px 38px 20px; border-radius: 16px; background: rgba(11, 13, 12, 0.78);
    font-family: "Playfair", "Heebo", serif; font-style: italic; font-weight: 600; font-size: 62px; line-height: 1.16; text-transform: none; letter-spacing: 0; color: #f4eee1;
    -webkit-text-stroke-width: 0; text-shadow: none; text-wrap: balance; }
  [dir="rtl"] .fx-cap.nar { left: 0; right: 0; font-family: "FrankRuhl", "Heebo", serif; font-style: normal; font-weight: 700; font-size: 68px; -webkit-text-stroke-width: 0; padding: 12px 38px 18px; }
  .fx-cap.nar span { margin: 0 0.11em; }
  .fx-cap.nar span.on { color: #f4eee1; }

  /* lower third: a documentary name strap */
  .fx-lt { position: absolute; left: 60px; display: none; }
  [dir="rtl"] .fx-lt { left: auto; right: 150px; text-align: right; }
  .fx-lt .n { display: inline-block; max-width: 900px; padding: 10px 26px 12px; background: #f4eee1; color: #16392b; font-weight: 900; font-size: 54px; line-height: 1.1; letter-spacing: 0.01em; text-transform: uppercase; }
  .fx-lt .w { display: table; margin-top: 0; padding: 9px 26px 11px; background: #16392b; color: #f4eee1; font-weight: 600; font-size: 38px; line-height: 1.12; max-width: 880px; }
  [dir="rtl"] .fx-lt .w { margin-inline-start: auto; }
  [dir="rtl"] .fx-lt .n { letter-spacing: 0; }

  /* sticker: one big line that slams in (a chapter card, a count, a verdict) */
  .fx-stk { position: absolute; left: 50px; right: 50px; display: none; text-align: center; font-weight: 900; font-size: 150px; line-height: 0.95;
    text-transform: uppercase; color: #ffd66b; -webkit-text-stroke: 18px #0b0d0c; paint-order: stroke fill; filter: drop-shadow(0 12px 0 rgba(0, 0, 0, 0.4)); }
  .fx-stk.white { color: #fff; }
  .fx-stk small { display: block; margin-top: 18px; font-size: 0.42em; color: #fff; -webkit-text-stroke-width: 12px; }

  /* tag: a small label pinned to a corner (a timestamp, "Illustration") */
  .fx-tag { position: absolute; display: none; left: 60px; padding: 8px 20px 10px; border-radius: 10px; background: rgba(11, 13, 12, 0.72); color: #fff; font-weight: 700; font-size: 36px; letter-spacing: 0.04em; text-transform: uppercase; }
  [dir="rtl"] .fx-tag { left: auto; right: 150px; letter-spacing: 0; }
  /* burst: a pile of things that fills the bare wall around a speaker: browser windows (tabs), chat bubbles */
  .fx-brs { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; display: none; font-family: "Mont", "Heebo", sans-serif; }
  .fx-brs .cd { position: absolute; transform-origin: 50% 50%; }
  .fx-brs.tabs .cd { width: 372px; border-radius: 16px; background: #fff; box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); overflow: hidden; }
  .fx-brs.tabs .cd .bar { height: 40px; background: #dfe4ea; display: flex; align-items: center; gap: 8px; padding: 0 14px; direction: ltr; }
  .fx-brs.tabs .cd .bar i { width: 13px; height: 13px; border-radius: 50%; background: #ff5f57; }
  .fx-brs.tabs .cd .bar i + i { background: #febc2e; }
  .fx-brs.tabs .cd .bar i + i + i { background: #28c840; }
  .fx-brs.tabs .cd .ttl { padding: 13px 18px 4px; font-weight: 800; font-size: 33px; line-height: 1.1; color: #14201a; white-space: nowrap; }
  .fx-brs.tabs .cd .ln { height: 10px; margin: 9px 16px; border-radius: 5px; background: #d7dce2; }
  .fx-brs.tabs .cd .ln.s { width: 52%; margin-bottom: 16px; }
  .fx-brs.chat .cd { max-width: 450px; padding: 13px 22px 15px; border-radius: 26px; background: #fff; color: #14201a; font-weight: 700; font-size: 38px; line-height: 1.15;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.45); }
  .fx-brs.chat .cd.me { background: #d9fdd3; }
  .fx-brs.chat .cd small { display: block; font-weight: 800; font-size: 26px; color: #1f8a4c; margin-bottom: 2px; }
  /* card: a stamped file card (an exhibit, a chapter, a countdown) */
  .fx-crd { position: absolute; display: none; left: 60px; padding: 14px 24px 16px; background: #f4eee1; color: #14201a; border: 5px solid #b3261e; border-radius: 6px;
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.5); transform-origin: 20% 50%; font-family: "Mont", "Heebo", sans-serif; }
  [dir="rtl"] .fx-crd { left: auto; right: 150px; text-align: right; transform-origin: 80% 50%; }
  .fx-crd .k { font-weight: 900; font-size: 30px; letter-spacing: 0.12em; text-transform: uppercase; color: #b3261e; }
  [dir="rtl"] .fx-crd .k { letter-spacing: 0.02em; }
  .fx-crd .t { font-weight: 900; font-size: 58px; line-height: 1.02; text-transform: uppercase; margin-top: 2px; }
  .fx-crd .s { font-weight: 700; font-size: 35px; margin-top: 6px; color: #3c4a42; letter-spacing: 0.04em; text-transform: uppercase; }
  [dir="rtl"] .fx-crd .s { letter-spacing: 0; }
  /* chat: a group chat as a full panel: header with a running count, one system line, bubbles that flood in */
  .fx-cht { position: absolute; display: none; left: 70px; right: 70px; top: 300px; height: 1180px; border-radius: 44px; overflow: hidden; background: #ece5dd;
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55); font-family: "Mont", "Heebo", sans-serif; }
  .fx-cht .hd { height: 132px; background: #16392b; color: #f4eee1; display: flex; align-items: center; gap: 22px; padding: 0 34px; }
  .fx-cht .hd .av { flex: none; width: 84px; height: 84px; border-radius: 50%; background: #e6c47a; display: grid; place-items: center; font-size: 44px; }
  .fx-cht .hd .nm { font-weight: 800; font-size: 44px; line-height: 1.05; }
  .fx-cht .hd .ct { font-weight: 600; font-size: 28px; opacity: 0.8; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .fx-cht .bd { position: absolute; left: 0; right: 0; top: 132px; bottom: 0; padding: 26px 30px; }
  .fx-cht .sys { position: relative; display: table; margin: 0 auto 22px; padding: 10px 26px 12px; border-radius: 18px; background: #d9e3dc; color: #33443b; font-weight: 700; font-size: 34px; }
  .fx-cht .sys svg { position: absolute; left: -26px; top: -18px; width: calc(100% + 52px); height: calc(100% + 36px); overflow: visible; }
  .fx-cht .bb { display: table; max-width: 680px; margin: 0 0 16px; padding: 14px 24px 16px; border-radius: 26px; background: #fff; color: #14201a; font-weight: 700; font-size: 40px; line-height: 1.15;
    box-shadow: 0 3px 8px rgba(0, 0, 0, 0.12); transform-origin: 0 100%; }
  .fx-cht .bb.me { margin-inline-start: auto; background: #d9fdd3; transform-origin: 100% 100%; }
  .fx-cht .bb small { display: block; font-weight: 800; font-size: 26px; color: #1f8a4c; margin-bottom: 2px; }
  /* circle: a red marker ring drawn round something in the picture, with a label */
  .fx-crc { position: absolute; display: none; left: 0; top: 0; width: 1080px; height: 1920px; }
  .fx-crc svg { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; }
  .fx-crc .lb { position: absolute; padding: 8px 18px 10px; background: #b3261e; color: #fff; font: 800 34px/1.1 "Mont", "Heebo", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; }
  [dir="rtl"] .fx-crc .lb { letter-spacing: 0; }
  /* pin: a small name label with a pointer, stuck on somebody in the picture */
  .fx-tag.chat { background: rgba(244, 238, 225, 0.94); color: #16392b; font-size: 30px; font-weight: 600; text-transform: none; letter-spacing: 0; padding: 7px 18px 9px; border-radius: 18px 18px 18px 4px; }
  /* a group-chat header: avatar, chat name, member count (the day tag sits under it, so the date belongs to the chat) */
  .fx-chd { position: absolute; display: none; left: 60px; padding: 12px 34px 12px 12px; border-radius: 60px; background: rgba(246, 244, 238, 0.95); color: #14201a; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.28); }
  [dir="rtl"] .fx-chd { left: auto; right: 150px; padding: 12px 12px 12px 34px; }
  .fx-chd .row { display: flex; align-items: center; gap: 18px; }
  .fx-chd .av { flex: none; width: 78px; height: 78px; border-radius: 50%; background: #16392b; display: grid; place-items: center; }
  .fx-chd .nm { font-weight: 800; font-size: 36px; line-height: 1.12; white-space: nowrap; }
  .fx-chd .ct { font-weight: 600; font-size: 27px; color: #5d6a62; margin-top: 1px; white-space: nowrap; }
  /* sign-off of a series episode: the brand signs, it does not sell (no button, no price, no product) */
  .fx-sgn { position: absolute; display: none; left: 0; right: 0; top: 0; bottom: 0; text-align: center; color: #f4eee1; }
  .fx-sgn .cr { position: absolute; left: 50%; top: 520px; width: 230px; height: 230px; margin-left: -115px; }
  .fx-sgn .wm { position: absolute; left: 0; right: 0; top: 800px; font: 500 78px/1 "Playfair", serif; letter-spacing: 0.3em; text-indent: 0.3em; direction: ltr; }
  .fx-sgn .ti { position: absolute; left: 80px; right: 80px; top: 930px; font: italic 700 82px/1.08 "Playfair", "FrankRuhl", serif; color: #e6c47a; text-wrap: balance; }
  [dir="rtl"] .fx-sgn .ti { font: 700 86px/1.1 "FrankRuhl", "Heebo", serif; }
  .fx-sgn .ln { position: absolute; left: 90px; right: 90px; top: 1130px; font: 600 46px/1.2 "Mont", "Heebo", sans-serif; text-wrap: balance; }
  .fx-sgn .sm { position: absolute; left: 90px; right: 90px; top: 1290px; font: 500 36px/1.25 "Mont", "Heebo", sans-serif; color: rgba(244, 238, 225, 0.72); text-wrap: balance; }
  .fx-pin { position: absolute; display: none; transform-origin: 50% 100%; }
  .fx-pin .b { padding: 8px 20px 10px; background: #f4eee1; color: #16392b; font: 900 40px/1 "Mont", "Heebo", sans-serif; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap;
    box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); }
  [dir="rtl"] .fx-pin .b { letter-spacing: 0; }
  .fx-pin i { display: block; width: 0; height: 0; margin: 0 auto; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 20px solid #f4eee1; }
  /* bug: the brand's wordmark, small, in a corner for the whole of the live action (like a channel ident) */
  .fx-tag.bug { background: none; padding: 0; border-radius: 0; font: 600 30px/1 "Playfair", "Heebo", serif; font-style: normal; letter-spacing: 0.34em; color: rgba(244, 238, 225, 0.86);
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.75), 0 0 2px rgba(0, 0, 0, 0.6); }
  [dir="rtl"] .fx-tag.bug { letter-spacing: 0.34em; left: 60px; right: auto; }
  /* notification: a phone banner that drops in from the top (the app's kick-off alert) */
  .fx-ntf { position: absolute; left: 60px; right: 60px; display: none; padding: 26px 30px 28px; border-radius: 44px; background: rgba(246, 244, 238, 0.94);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45); color: #14201a; font-family: "Mont", "Heebo", sans-serif; }
  .fx-ntf .row { display: flex; align-items: center; gap: 22px; }
  .fx-ntf .ic { flex: none; width: 92px; height: 92px; border-radius: 22px; background: #16392b; display: grid; place-items: center; color: #e6c47a; font: italic 700 62px/1 "Playfair", serif; }
  .fx-ntf .app { font-weight: 700; font-size: 30px; letter-spacing: 0.06em; text-transform: uppercase; color: #5d6a62; }
  .fx-ntf .ttl { margin-top: 4px; font-weight: 800; font-size: 46px; line-height: 1.1; white-space: pre-line; }
  .fx-ntf .bod { margin-top: 4px; font-weight: 600; font-size: 40px; line-height: 1.15; color: #2c3a33; white-space: pre-line; }
  .fx-ntf .now { margin-inline-start: auto; align-self: flex-start; font-weight: 600; font-size: 28px; color: #7a857e; }
  /* badge: an app icon with a red unread counter that races up (forty-seven tabs, nine hundred messages) */
  .fx-bdg { position: absolute; display: none; width: 176px; height: 176px; transform-origin: 50% 60%; }
  .fx-bdg .ic { width: 176px; height: 176px; border-radius: 42px; display: grid; place-items: center; box-shadow: 0 18px 44px rgba(0, 0, 0, 0.5), inset 0 2px 0 rgba(255, 255, 255, 0.35); }
  .fx-bdg.chat .ic { background: linear-gradient(#62e476, #1eb244); }
  .fx-bdg.tabs .ic { background: linear-gradient(#fafbfc, #d3dae1); }
  .fx-bdg .ic svg { width: 112px; height: 112px; display: block; }
  .fx-bdg .n { position: absolute; top: -36px; right: -46px; min-width: 52px; height: 92px; padding: 0 22px; border-radius: 46px; background: #ff3b30; color: #fff;
    font: 800 58px/92px "Mont", sans-serif; letter-spacing: -0.02em; text-align: center; box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45); transform-origin: 50% 50%; font-variant-numeric: tabular-nums; }
  .fx-tag i { display: inline-block; width: 18px; height: 18px; margin-inline-end: 12px; border-radius: 50%; background: #e23b3b; vertical-align: 0.02em; }
</style>
</head>
<body>
<div id="stage"></div>
<script>
  // { lang, caps: [{ t0, t1, y, words: [{ w, t0, t1 }] }], lts: [{ t0, t1, y, name, what }],
  //   stickers: [{ t0, t1, y, text, small, cls, size }], tags: [{ t0, t1, y, text, rec }],
  //   notifs: [{ t0, t1, y, title, body, when }],
  //   badges: [{ t0, t1, x, y, icon: "chat"|"tabs", from, to, wait, run, more: [seconds after t0], rot }] }
  const TL = JSON.parse(new URLSearchParams(location.search).get("tl") || "{}");
  if (TL.lang === "he") { document.documentElement.lang = "he"; document.documentElement.dir = "rtl"; }
  const RTL = TL.lang === "he";
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const P = (t, s, d) => clamp((t - s) / d);
  const out = (p) => 1 - Math.pow(1 - p, 3);
  const back = (p) => { const c = 2.2; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
  const stage = document.getElementById("stage");
  const mk = (cls, html) => { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; stage.appendChild(el); return el; };

  const caps = (TL.caps || []).map((c) => {
    const el = mk("fx-cap" + (c.cls ? " " + c.cls : ""), "");
    el.style.top = `${c.y ?? 1240}px`;
    if (c.size) el.style.fontSize = `${c.size}px`;
    const spans = c.words.map((w) => { const s = document.createElement("span"); s.textContent = w.w; el.appendChild(s); el.appendChild(document.createTextNode(" ")); return s; });
    return { ...c, el, spans };
  });
  const lts = (TL.lts || []).map((c) => {
    const el = mk("fx-lt", `<div class="n"></div><div class="w"></div>`);
    el.style.top = `${c.y ?? 1400}px`;
    el.querySelector(".n").textContent = c.name; el.querySelector(".w").textContent = c.what || "";
    if (c.size) el.querySelector(".n").style.fontSize = `${c.size}px`;
    if (c.wsize) el.querySelector(".w").style.fontSize = `${c.wsize}px`;
    if (!c.what) el.querySelector(".w").style.display = "none";
    return { ...c, el };
  });
  const stickers = (TL.stickers || []).map((c) => {
    const el = mk("fx-stk" + (c.cls ? " " + c.cls : ""), "");
    el.style.top = `${c.y ?? 760}px`;
    if (c.size) el.style.fontSize = `${c.size}px`;
    el.append(document.createTextNode(c.text));
    if (c.small) { const s = document.createElement("small"); s.textContent = c.small; el.appendChild(s); }
    return { ...c, el };
  });
  const tags = (TL.tags || []).map((c) => {
    const el = mk("fx-tag" + (c.cls ? " " + c.cls : ""), "");
    el.style.top = `${c.y ?? 300}px`;
    if (c.x != null) { el.style.left = `${c.x}px`; el.style.right = "auto"; }
    if (c.rec) el.appendChild(document.createElement("i"));
    el.append(document.createTextNode(c.text));
    return { ...c, el };
  });

  const ntfs = (TL.notifs || []).map((c) => {
    const el = mk("fx-ntf", `<div class="row"><div class="ic">V</div><div><div class="app">Venuvoy</div><div class="ttl"></div><div class="bod"></div></div><div class="now"></div></div>`);
    el.style.top = `${c.y ?? 300}px`;
    el.querySelector(".ttl").textContent = c.title; el.querySelector(".bod").textContent = c.body || ""; el.querySelector(".now").textContent = c.when || (RTL ? "עכשיו" : "now");
    return { ...c, el };
  });

  const GLYPH = {
    chat: '<svg viewBox="0 0 112 112"><path fill="#fff" d="M56 14c-25 0-45 16.5-45 37 0 11.6 6.4 22 16.500 28.800L23 98l20.500-10.600c4 .9 8.200 1.400 12.500 1.400 25 0 45-16.500 45-37S81 14 56 14z"/></svg>',
    tabs: '<svg viewBox="0 0 112 112"><rect x="8" y="20" width="96" height="74" rx="11" fill="#fff" stroke="#8a96a3" stroke-width="5"/><path d="M8 44h96" stroke="#8a96a3" stroke-width="5"/><rect x="15" y="26" width="26" height="14" rx="4" fill="#3b82f6"/><rect x="45" y="26" width="26" height="14" rx="4" fill="#c5ccd4"/><rect x="75" y="26" width="22" height="14" rx="4" fill="#c5ccd4"/><rect x="20" y="54" width="52" height="7" rx="3.500" fill="#c5ccd4"/><rect x="20" y="68" width="72" height="7" rx="3.500" fill="#dde2e7"/></svg>',
  };
  const bdgs = (TL.badges || []).map((c) => {
    const el = mk("fx-bdg " + (c.icon || "chat"), `<div class="ic">${GLYPH[c.icon || "chat"]}</div><div class="n"></div>`);
    el.style.top = `${c.y ?? 300}px`; el.style.left = `${c.x ?? 800}px`;
    return { ...c, el, n: el.querySelector(".n") };
  });

  // gfx: free graphics by type. Times inside each (stamp, bubbles[].t, count.at, circle) are seconds from its own t0.
  const esc = (x) => String(x ?? "").replace(/[&<>]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[ch]));
  const RING = (w, h) => `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><ellipse cx="${w / 2}" cy="${h / 2}" rx="${w / 2 - 6}" ry="${h / 2 - 6}" fill="none" stroke="#e02b20" stroke-width="9" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(-4 ${w / 2} ${h / 2})"/></svg>`;
  const gfx = (TL.gfx || []).map((g) => {
    if (g.type === "card") {
      const el = mk("fx-crd", (g.kicker ? `<div class="k">${esc(g.kicker)}</div>` : "") + `<div class="t">${esc(g.title)}</div>` + (g.sub ? `<div class="s">${esc(g.sub)}</div>` : ""));
      el.style.top = `${g.y ?? 300}px`;
      if (g.x != null) { el.style.left = `${g.x}px`; el.style.right = "auto"; }
      if (g.size) el.querySelector(".t").style.fontSize = `${g.size}px`;
      return { ...g, el };
    }
    if (g.type === "chat") {
      const el = mk("fx-cht", `<div class="hd"><div class="av">⚽</div><div><div class="nm">${esc(g.title)}</div><div class="ct"></div></div></div><div class="bd">` +
        (g.sys ? `<div class="sys">${esc(g.sys)}${RING(400, 100)}</div>` : "") +
        (g.bubbles || []).map((b) => `<div class="bb${b.me ? " me" : ""}">${b.who ? `<small>${esc(b.who)}</small>` : ""}${esc(b.text)}</div>`).join("") + `</div>`);
      if (g.y != null) el.style.top = `${g.y}px`;
      if (g.h != null) el.style.height = `${g.h}px`;
      return { ...g, el, ct: el.querySelector(".ct"), bbs: [...el.querySelectorAll(".bb")], ring: el.querySelector(".sys ellipse") };
    }
    if (g.type === "circle") {
      const el = mk("fx-crc", `<svg viewBox="0 0 1080 1920"><ellipse cx="${g.cx}" cy="${g.cy}" rx="${g.rx}" ry="${g.ry}" fill="none" stroke="${g.color || "#e02b20"}" stroke-width="${g.width ?? 10}" stroke-linecap="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100" transform="rotate(${g.rot ?? -6} ${g.cx} ${g.cy})"/></svg>` + (g.label ? `<div class="lb">${esc(g.label)}</div>` : ""));
      const lb = el.querySelector(".lb");
      if (lb) { lb.style.top = `${g.ly ?? g.cy + g.ry + 14}px`; if (RTL && g.lx_he != null) lb.style.left = `${g.lx_he}px`; else lb.style.left = `${g.lx ?? g.cx - g.rx}px`; }
      return { ...g, el, ring: el.querySelector("ellipse"), lb };
    }
    if (g.type === "pin") {
      const el = mk("fx-pin", `<div class="b">${esc(g.label)}</div>` + (g.arrow === false ? "" : "<i></i>"));
      el.style.left = `${g.x}px`; el.style.top = `${g.y}px`;
      if (g.size) el.querySelector(".b").style.fontSize = `${g.size}px`;
      return { ...g, el };
    }
    if (g.type === "signoff") {
      const el = mk("fx-sgn", `<div class="cr"><svg viewBox="0 0 40 40" width="230" height="230"><circle cx="20" cy="20" r="19" fill="#16392b"/><circle cx="20" cy="20" r="18.25" fill="none" stroke="#e6c47a" stroke-width="1"/><circle cx="20" cy="20" r="15.6" fill="none" stroke="#e6c47a" stroke-width="0.6"/><path d="M20 1.2 21 2.9 20 4.6 19 2.9Z" fill="#e6c47a"/><path d="M20 35.4 21 37.1 20 38.8 19 37.1Z" fill="#e6c47a"/><path d="M11.2 11.6h6.6v.75l-1.6.2 4.35 11.4 3.95-10.6c.25-.68.05-.95-.65-1.05l-1.05-.15v-.75h5.05v.75l-.75.12c-.6.1-.92.4-1.2 1.12L20.3 28.9h-.95l-6.3-16.1c-.25-.62-.55-.9-1.1-.98l-.75-.1Z" fill="#f4eee1"/></svg></div><div class="wm">VENUVOY</div>` +
        (g.title ? `<div class="ti">${esc(g.title)}</div>` : "") + (g.line ? `<div class="ln">${esc(g.line)}</div>` : "") + (g.small ? `<div class="sm">${esc(g.small)}</div>` : ""));
      return { ...g, el, parts: [...el.children] };
    }
    if (g.type === "chathead") {
      const el = mk("fx-chd", `<div class="row"><div class="av"><svg viewBox="0 0 64 64" width="58" height="58"><circle cx="17" cy="27" r="7" fill="#b89a55"/><path d="M3 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="47" cy="27" r="7" fill="#b89a55"/><path d="M33 50c0-8 6-12 14-12s14 4 14 12z" fill="#b89a55"/><circle cx="32" cy="25" r="9" fill="#e6c47a"/><path d="M14 55c0-10 8-15 18-15s18 5 18 15z" fill="#e6c47a"/></svg></div><div><div class="nm">${esc(g.name)}</div><div class="ct">${esc(g.members || "")}</div></div></div>`);
      el.style.top = `${g.y ?? 300}px`;
      return { ...g, el };
    }
    return { ...g, el: mk("", "") };
  });

  // bursts: [{ t0, t1, kind: "tabs"|"chat", cards: [{ x, y, rot, text, who, me, t }] }]
  const brs = (TL.bursts || []).map((b) => {
    const el = mk("fx-brs " + b.kind, "");
    const cards = b.cards.map((c) => {
      const d = document.createElement("div");
      d.className = "cd" + (c.me ? " me" : "");
      d.style.left = `${c.x}px`; d.style.top = `${c.y}px`;
      if (b.kind === "tabs") d.innerHTML = `<div class="bar"><i></i><i></i><i></i></div><div class="ttl"></div><div class="ln"></div><div class="ln s"></div>`;
      else d.innerHTML = (c.who ? `<small></small>` : "") + `<span></span>`;
      if (b.kind === "tabs") { d.querySelector(".ttl").textContent = c.text.replace(/^!/, ""); if (c.text.startsWith("!")) d.style.outline = "7px solid #e02b20"; }
      else { if (c.who) d.querySelector("small").textContent = c.who; d.querySelector("span").textContent = c.text; }
      el.appendChild(d);
      return { ...c, el: d };
    });
    return { ...b, el, cards };
  });

  window.seek = (t) => {
    for (const g of gfx) {
      const on = t >= g.t0 - 1e-3 && t < g.t1 - 1e-3;
      g.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const u = t - g.t0, x = 1 - P(t, g.t1 - 0.1, 0.1);
      if (g.type === "signoff") {
        g.parts.forEach((el, i) => {  // crest, wordmark, title, line, small: one after another
          const a = out(P(u, (g.wait ?? 0.12) + i * 0.13, 0.32));
          el.style.opacity = a;
          el.style.transform = i === 0 ? `scale(${0.82 + 0.18 * back(a)})` : `translateY(${(1 - a) * 26}px)`;
        });
      } else if (g.type === "chathead") {
        const a = out(P(u, 0, 0.22));
        g.el.style.transform = `translateX(${(RTL ? 1 : -1) * (1 - a) * 40}px)`;
        g.el.style.opacity = a * (1 - P(t, g.t1 - 0.2, 0.2));
      } else if (g.type === "card") {
        const a = g.still ? 1 : P(u, 0, 0.14);  // "still": it was already there (the same slate, seen again)
        g.el.style.transform = `scale(${1.7 - 0.7 * out(a)}) rotate(${g.rot ?? -3}deg)`;
        g.el.style.opacity = Math.min(1, a * 3) * x;
        const tt = g.el.querySelector(".t");
        tt.style.textDecoration = g.strike != null && u >= g.strike ? "line-through" : "none";
        tt.style.textDecorationColor = "#b3261e"; tt.style.textDecorationThickness = "8px";
      } else if (g.type === "chat") {
        const a = out(P(u, 0, 0.3));
        g.el.style.transform = `translateY(${(1 - a) * 1500 + (1 - x) * 60}px)`;
        g.el.style.opacity = x;
        g.bbs.forEach((el, i) => {
          const b = g.bubbles[i], p = P(u, b.t, 0.12);
          el.style.display = u >= b.t && (b.until == null || u < b.until) ? "table" : "none";
          el.style.transform = `scale(${0.6 + 0.4 * back(p)})`;
        });
        if (g.count) {
          const c = g.count, p = out(P(u, c.at ?? 0, c.dur ?? 1));
          g.ct.textContent = (c.label || "{n}").replace("{n}", Math.round(c.from + (c.to - c.from) * p));
        } else g.ct.textContent = g.members || "";
        if (g.ring) { g.ring.setAttribute("stroke-dashoffset", g.circle == null ? 100 : 100 * (1 - out(P(u, g.circle, 0.3)))); g.ring.style.opacity = g.circle != null && u >= g.circle ? 1 : 0; }
      } else if (g.type === "pin") {
        const a = P(u, 0, 0.14);
        g.el.style.transform = `translate(-50%, -100%) scale(${0.5 + 0.5 * back(a)})`;
        g.el.style.opacity = Math.min(1, a * 3) * x;
      } else if (g.type === "circle") {
        g.ring.setAttribute("stroke-dashoffset", 100 * (1 - out(P(u, g.draw ?? 0.1, 0.3))));
        g.ring.style.opacity = u >= (g.draw ?? 0.1) ? 1 : 0;
        if (g.lb) g.lb.style.opacity = P(u, (g.draw ?? 0.1) + 0.25, 0.1);
        g.el.style.opacity = x;
      }
    }
    for (const b of brs) {
      const on = t >= b.t0 - 1e-3 && t < b.t1 - 1e-3;
      b.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const x = 1 - P(t, b.t1 - 0.1, 0.1);
      for (const c of b.cards) {
        const a = P(t, c.t, 0.14);
        c.el.style.opacity = a > 0 ? Math.min(1, a * 3) * x : 0;
        c.el.style.transform = `scale(${(0.5 + 0.5 * back(a)) * (0.92 + 0.08 * x)}) rotate(${c.rot || 0}deg)`;
      }
    }
    for (const c of ntfs) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const a = back(P(t, c.t0, 0.28)), x = c.stay ? 0 : P(t, c.t1 - 0.18, 0.18);  // "stay": it is still up when the shot is cut
      const d = c.drop ?? 420;  // "drop": how far it travels in and out (a short drop when something sits above it)
      c.el.style.transform = `translateY(${(1 - a) * -d - x * d}px) scale(${0.96 + 0.04 * a})`;
      c.el.style.opacity = c.drop != null ? Math.min(1, P(t, c.t0, 0.14) * 1.5) * (1 - x) : 1;
    }
    for (const c of bdgs) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const a = back(P(t, c.t0, 0.2)), x = 1 - P(t, c.t1 - 0.12, 0.12);
      // the count: a fast run up to the number (ease-out), then single late ticks ("still coming in")
      const p = out(P(t, c.t0 + (c.wait ?? 0.12), c.run ?? 0.9));
      let v = Math.round((c.from ?? 1) + ((c.to ?? 9) - (c.from ?? 1)) * p), last = c.t0 + (c.wait ?? 0.12) + (c.run ?? 0.9);
      for (const k of c.more || []) if (t >= c.t0 + k) { v += 1; last = c.t0 + k; }
      c.n.textContent = v;
      const running = p < 1, bump = running ? 0.08 * Math.abs(Math.sin(t * 38)) : 0.34 * (1 - P(t, last, 0.22));
      c.n.style.transform = `scale(${1 + bump})`;
      c.el.style.transform = `scale(${(c.scale ?? 1) * (0.4 + 0.6 * a) * (0.9 + 0.1 * x)}) rotate(${(c.rot ?? 5) + (running ? Math.sin(t * 31) * 1.6 : 0)}deg)`;
      c.el.style.opacity = Math.min(1, P(t, c.t0, 0.08) * 2) * x;
    }
    for (const c of caps) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const a = P(t, c.t0, 0.09);
      c.el.style.transform = `scale(${0.86 + 0.14 * back(a)})`;
      c.el.style.opacity = Math.min(1, a * 2.5);
      c.spans.forEach((s, i) => {
        const w = c.words[i], lit = t >= w.t0 - 0.02 && t < (c.words[i + 1]?.t0 ?? c.t1 + 1) - 0.02;
        s.className = lit ? "on" : "";
        const k = lit ? 1 - P(t, w.t0, 0.14) : 0;
        s.style.transform = lit && c.cls !== "nar" ? `scale(${1.06 + 0.1 * k}) translateY(${-4 - 6 * k}px)` : "";
      });
    }
    for (const c of lts) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const first = c.t0 < 0.01;  // on the first frame the strap is already there (the thumbnail must carry it)
      const a = first ? 1 : out(P(t, c.t0, 0.22)), b = first ? 1 : out(P(t, c.t0 + 0.1, 0.22)), x = 1 - P(t, c.t1 - 0.14, 0.14);
      const dir = RTL ? 1 : -1;
      const n = c.el.querySelector(".n"), w = c.el.querySelector(".w");
      n.style.clipPath = RTL ? `inset(0 0 0 ${(1 - a) * 100}%)` : `inset(0 ${(1 - a) * 100}% 0 0)`;
      w.style.clipPath = RTL ? `inset(0 0 0 ${(1 - b) * 100}%)` : `inset(0 ${(1 - b) * 100}% 0 0)`;
      c.el.style.transform = `translateX(${dir * (1 - a) * 30}px)`;
      c.el.style.opacity = x;
    }
    for (const c of stickers) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      const a = P(t, c.t0, 0.16), x = 1 - P(t, c.t1 - 0.1, 0.1);
      c.el.style.transform = `scale(${1.5 - 0.5 * out(a)}) rotate(${c.rot ?? -3}deg)`;
      c.el.style.opacity = Math.min(1, a * 3) * x;
    }
    for (const c of tags) {
      const on = t >= c.t0 - 1e-3 && t < c.t1 - 1e-3;  // times are rounded to a millisecond: never hang a frame past a cut
      c.el.style.display = on ? "block" : "none";
      if (!on) continue;
      c.el.style.opacity = Math.min(P(t, c.t0, 0.1), 1 - P(t, c.t1 - 0.1, 0.1));
      const dot = c.el.querySelector("i"); if (dot) dot.style.opacity = Math.floor(t * 2) % 2 ? 0.25 : 1;
    }
  };
  window.__ready = document.fonts.ready.then(() => Promise.all([...document.fonts].map((f) => f.load().catch(() => 0)))).then(() => { window.seek(0); return true; });
</script>
