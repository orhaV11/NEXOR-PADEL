<!doctype html>
<!-- The end card of "Plan, No Plan": the brand only signs. A plain warm cream card, the word VENUVOY in deep violet,
     the trip scarf (half teal, half coral, cream fringe) lying flat under it like an underline, two small words below.
     Static on purpose: no logo animation.  node src/film/s2/endcard.mjs <out.png>  -->
<html><head><meta charset="utf-8"><style>
  @font-face { font-family: "Nunito"; src: url(../../../fonts/nunito-latin-wght-normal.woff2) format("woff2"); font-weight: 200 1000; }
  html, body { margin: 0; background: #fbf3e2; }
  #card { position: relative; width: 1080px; height: 1920px; background: radial-gradient(120% 90% at 50% 42%, #fff8ea 0%, #fbf1dc 60%, #f6e8cd 100%); font-family: "Nunito", sans-serif; overflow: hidden; }
  .word { position: absolute; left: 0; right: 0; top: 760px; text-align: center; font-weight: 1000; font-size: 150px; letter-spacing: 0.16em; padding-left: 0.16em; color: #3a2a63; }
  .scarf { position: absolute; left: 190px; width: 700px; top: 968px; height: 64px; display: flex; border-radius: 6px; box-shadow: 0 10px 18px rgba(58, 42, 99, 0.18); transform: rotate(-1.2deg); }
  .scarf i { flex: 1; } .scarf i:nth-child(odd) { background: #1f8a8a; } .scarf i:nth-child(even) { background: #ff6f59; }
  .scarf i:first-child { border-radius: 6px 0 0 6px; } .scarf i:last-child { border-radius: 0 6px 6px 0; }
  .fr { position: absolute; top: 968px; height: 64px; width: 34px; background: repeating-linear-gradient(180deg, #e6d3a8 0 7px, transparent 7px 12px); transform: rotate(-1.2deg); }
  .fr.l { left: 156px; margin-top: 7px; } .fr.r { left: 890px; margin-top: -8px; }
  .small { position: absolute; left: 0; right: 0; top: 1078px; text-align: center; font-weight: 800; font-size: 54px; letter-spacing: 0.08em; color: #3a2a63; opacity: 0.82; }
</style></head><body><div id="card">
  <div class="word">VENUVOY</div>
  <div class="fr l"></div><div class="scarf"><i></i><i></i><i></i><i></i><i></i><i></i></div><div class="fr r"></div>
  <div class="small">football trips</div>
</div></body></html>
