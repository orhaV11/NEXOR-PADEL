  const ICONS = [

      const arcs = {}; web.forEach((_, i) => { arcs["w" + i] = P(tw, 0.05 + i * 0.06, 0.9); });
      firstArcs.forEach(([id]) => { arcs[id] = 1; });
      gb.update(t, { face, dist: lerp(9.6, 1.15, dive), lookY: lerp(-0.7, 0, dive), arcs, allPins: true });
      put($("kick"), { ...slam(tw, 0.1, 0.3), op: slam(tw, 0.1, 0.3).op * (1 - dive) });
      ["st1", "st2", "st3", "st4"].forEach((id, i) => { const s0 = [0.4, 1.0, 1.6, 2.8][i], p = slam(tw, s0, 0.26, 1.9); put($(id), { op: p.op * (1 - dive), s: p.s, blur: p.blur * 0.6 }); });
      [...$("icons").children].forEach((ic, i) => { const p = pop(tw, 1.72 + i * 0.15, 0.22); put(ic, { op: p.op * (1 - dive), s: p.s, y: Math.sin((tw - 1.72 - i * 0.15) * 9) * 4 }); });
    }

    /* S6 · the peak: low on the pitch, fireworks, the stand jumping */
    if (show("s6", t)) {
      use3d = "stadium";
      const tp = t - 16;
      st.update(t, { wave: 0, jump: 1, phones: 0.8, fireworks: [16.1, 16.45, 16.9, 17.4, 18.0, 18.6, 19.2].map((t0, i) => [t0, [-30, 12, -50, 30, -10, 25, -40][i], 46 + (i % 3) * 5, [-62, -66, -58, -64, -70, -60, -66][i], ["#ffd27a", "#ff6a7e", "#fff1c9", "#ffd27a", "#9fd3ff", "#ff6a7e", "#ffd27a"][i]]), confetti: 1, confettiT: tp + 1.5, confettiAt: { x: 22, y: 0, z: 20 } });
      st.shoot(t, [[16, [36, 1.7, 21], [-12, 14, -42], 66], [20, [24, 1.9, 27], [-20, 16, -40], 60]]);
      const sh = shake(t, [16.0, 16.45, 17.4], 18);
      const be = slam(tp, 0.02, 0.3, 2.2), gone = E.in(P(tp, 1.75, 0.2));
      put($("be"), { op: be.op * (1 - gone), s: be.s * lerp(1, 1.08, P(tp, 0, 1.9)), blur: be.blur, x: sh.x, y: sh.y });
      kinetic($("tg1"), tp, 1.95, { stagger: 0.09 });
      kinetic($("tg2"), tp, 2.15, { stagger: 0.11, rise: 90 });
    }

    /* S7 · price, honest and simple */
    if (show("s7", t)) {
      const tq = t - 20;
      put($("pr1"), slam(tq, 0.02, 0.28));
      put($("pr2"), slam(tq, 0.16, 0.28));
      const sb = E.out(P(tq, 0.5, 0.3)); put($("prSub"), { op: sb, y: (1 - sb) * 30 });
      [["c1", 0.85], ["c2", 1.0], ["c3", 1.15]].forEach(([id, s0]) => { const p = pop(tq, s0, 0.3); put($(id), { op: p.op, s: p.s }); });
      put($("noSub"), { ...slam(tq, 1.4, 0.22, 2.0), r: -3, x: shake(tq, [1.42], 10).x });
    }

    /* S8 · end card over the stadium, softly out of focus */
    if (show("s8", t)) {
      use3d = "end";
      const te = t - 23;
      const cr = E.elastic(P(te, 0, 0.9));
      put($("crest"), { op: clamp(P(te, 0, 0.12)), s: cr, r: (1 - cr) * 25 });
      $("sweepBar").style.left = `${lerp(-60, 140, E.inOut(P(te, 0.55, 0.7)))}%`;
      const wm = E.out(P(te, 0.3, 0.5));
      put($("word"), { op: wm, y: (1 - wm) * 50 });
      $("word").style.letterSpacing = `${lerp(0.6, 0.3, wm)}em`;
      put($("tag1"), slam(te, 0.55, 0.3));
      const cb = pop(te, 0.95, 0.4), pulse = 1 + 0.05 * Math.max(0, Math.sin(Math.PI * P(te, 2.4, 0.35))) + 0.012 * Math.sin(te * 4);
      put($("cta"), { op: cb.op, s: cb.s * pulse });
      $("ctaArrow").style.translate = `${(RTL ? -1 : 1) * 7 * (1 - Math.cos(2 * Math.PI * Math.max(0, te - 1.4) / 0.8)) / 2}px 0`;
      put($("url"), { op: E.out(P(te, 1.25, 0.4)) });
    }

    // 3D: render only what this frame shows; the end card's backdrop is rendered once
    const glEl = $("gl");
    glEl.style.display = use3d ? "block" : "none";
    glEl.style.filter = use3d === "end" ? "blur(12px)" : "";
    if (use3d === "stadium") { gl3.render(st.scene, st.camera); endRendered = false; }
    else if (use3d === "globe") { gl3.render(gb.scene, gb.camera); endRendered = false; }
    else if (use3d === "end" && !endRendered) {
      st.update(23, { wave: 0, phones: 0.7 });
      st.shoot(0, [[0, [0, 55, 96], [0, 4, 0], 48]]);
      gl3.render(st.scene, st.camera);
      endRendered = true;
    }
  };

  window.__ready = window.__ready.then(() => fontsReady()).then(() => { VV.hydrate(); window.seek(0); return true; });
</script>
