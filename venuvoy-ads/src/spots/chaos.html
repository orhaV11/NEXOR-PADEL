    put($("cap1"), { op: (t < 6.0 ? 1 : 0), ...(t < 0.3 ? { s: lerp(1.04, 1, E.out(P(t, 0, 0.3))) } : {}) });
    put($("cap2"), { ...pop(t, 6.02, 0.3), op: t >= 6.02 && t < 6.55 ? 1 : 0 });
    put($("cap3"), { op: t >= 6.6 && t < 12 ? clamp(P(t, 6.6, 0.2) * 3) : 0 });

    if (show("desk", t)) {
      let n = 12; for (const [tt, k] of TAB_AT) if (tc >= tt) n = k;
      tabs(n);
      const cb = 1 + 0.25 * Math.max(0, 1 - (tc - TAB_AT.filter(([tt]) => tc >= tt).pop()[0]) / 0.18);
      put($("count"), { s: cb });
      // shake grows with the mess
      const lvl = clamp((tc - 1) / 5);
      const hits = gags.map((g) => g.t).concat([5.0, 5.1, 5.35, 5.6, 5.75]);
      const sh = shake(tc, hits, 10 + 22 * lvl, 0.45);
      const jitter = frozen ? 0 : Math.sin(tc * 61) * 6 * lvl;
      const zoom = frozen ? lerp(1, 1.07, E.out(P(t, 6.0, 0.5))) : 1;
      deskIn.style.transform = `translate(${sh.x + jitter}px, ${sh.y}px) rotate(${sh.r * 1.5}deg) scale(${zoom})`;
      $("desk").style.filter = frozen ? `grayscale(${clamp(P(t, 6.0, 0.08))}) contrast(1.12)` : "";
      $("redPulse").style.opacity = frozen ? 0 : clamp((tc - 4.4) / 1.2) * (0.6 + 0.4 * Math.sin(tc * 18));
      gags.forEach(({ t: t0, el }) => {
        const p = E.back(P(tc, t0, 0.24)), op = clamp(P(tc, t0, 0.06) * 3);
        put(el, { op, s: tc < t0 ? 0.6 : lerp(0.6, 1, clamp(p)) * (p > 1 ? p : 1), r: +el.dataset.rot + (1 - clamp(p)) * 12 });
      });
      $("q1").textContent = T.search.slice(0, Math.round(T.search.length * clamp(0.25 + 0.75 * P(tc, 0.05, 0.7))));
      // the sketchy site flashes
      const fl = Math.floor(tc * 8) % 2;
      $("hot").style.color = fl ? "#e0262f" : "#111"; $("hot").style.background = fl ? "#ffe14d" : "transparent";
      $("buy").style.transform = `scale(${1 + 0.06 * Math.sin(tc * 16)}) rotate(${Math.sin(tc * 11) * 2}deg)`;
      const secs = Math.max(0, 598 - Math.floor((tc - 1) * 7)); $("timer").textContent = (LANG === "he" ? "נשארו " : "") + `0${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, "0")}` + (LANG === "he" ? "" : " left");
      put($("tbc"), { ...slam(tc, 1.55, 0.2, 2.6), r: -12 });
      put(chat, { op: clamp(P(tc, 1.95, 0.08) * 3), y: (1 - E.out(P(tc, 1.95, 0.25))) * 500, r: 2 });
      bubTimes.forEach((bt, i) => { const p = pop(tc, bt, 0.22); put($("bub" + i), { op: p.op, s: p.s }); });
      $("num").textContent = tc < 3.0 ? "" : ["€1,4??", "€2,1??", "€9??", "€1,7??", "€???"][Math.floor(tc * 9) % 5];
      echoes.forEach(({ el, t: t0, r }) => { const p = E.back(P(tc, t0, 0.2)); put(el, { op: clamp(P(tc, t0, 0.05) * 3), s: tc < t0 ? 0.5 : lerp(0.5, 1, clamp(p)), r: r + (1 - clamp(p)) * 10 }); });
      toasts.forEach(({ el, t: t0 }) => { const p = E.out(P(tc, t0, 0.18)); put(el, { op: p, y: (1 - p) * 60 }); });
      put(spin, { op: clamp(P(tc, 5.3, 0.15)), r: tc * 520, s: 1 });
    }

    if (show("calm", t)) {
      const tk = t - 6.55;
      const sl = E.out5(P(tk, 0, 0.35));
      $("calm").style.transform = `translateY(${(1 - sl) * 1920}px)`;
      const ph = E.out(P(tk, 0.1, 0.45));
      $("cph").style.transform = `perspective(2200px) translateY(${(1 - ph) * 500}px) rotateX(${(1 - ph) * 20}deg) scale(${lerp(1, 0.86, E.inOut(P(tk, 1.6, 0.5)))})`;
      $("cph").style.transformOrigin = "50% 0%";
      const tp = P(tk, 0.4, 1.0);
      $("typed").textContent = T.sentence.slice(0, Math.round(T.sentence.length * tp));
      $("caret").style.opacity = (tp > 0 && tp < 1) || Math.floor(t * 4) % 2 === 0 ? 1 : 0;
      $("askView").style.opacity = 1 - E.out(P(tk, 1.55, 0.2));
      const res = E.out(P(tk, 1.62, 0.4)); put($("results"), { op: res, y: (1 - res) * 300 });
      [["k1", 2.05], ["k2", 2.45], ["k3", 2.85]].forEach(([id, s0], i) => { const p = slam(tk, s0, 0.22, 1.5); put($(id), { op: p.op, s: p.s, blur: p.blur * 0.5, r: [-2, 1.5, -1][i] }); });
      put($("done"), { ...slam(tk, 3.4, 0.26, 2.2), r: -6 });
    }

    if (show("end", t)) {
      const te = t - 12;
      const cr = E.elastic(P(te, 0, 0.9));
      put($("crest"), { op: clamp(P(te, 0, 0.12)), s: cr, r: (1 - cr) * 25 });
      const wm = E.out(P(te, 0.25, 0.5)); put($("word"), { op: wm, y: (1 - wm) * 50 }); $("word").style.letterSpacing = `${lerp(0.6, 0.3, wm)}em`;
      put($("tagline"), slam(te, 0.45, 0.3));
      const cb = pop(te, 0.85, 0.4); put($("cta"), { op: cb.op, s: cb.s * (1 + 0.012 * Math.sin(te * 4)) });
      $("ctaArrow").style.translate = `${(RTL ? -1 : 1) * 7 * (1 - Math.cos(2 * Math.PI * Math.max(0, te - 1.3) / 0.8)) / 2}px 0`;
      put($("url"), { op: E.out(P(te, 1.1, 0.4)) });
    }
  };

  window.__ready = window.__ready.then(() => fontsReady()).then(() => { VV.hydrate(); window.seek(0); return true; });
</script>
