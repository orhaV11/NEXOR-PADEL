        burst("b1", tk, 0.0, 540, 1600); if (tk > 0.25) burst("b1", tk, 0.25, 540, 1600); if (tk > 0.7) burst("b1", tk, 0.7, 540, 840);
        $("net").style.transform = tk > 0.7 ? `scaleY(${1 + 0.18 * Math.sin((tk - 0.7) * 30) * Math.exp(-(tk - 0.7) * 6)})` : "";
        $("net").style.transformOrigin = "540px 838px";
      }
      if (k === 2) {

        const pts = [[180, 260, 0], [560, 1180, 0.06], [880, 640, 0.5], [420, 1240, 0.78], [300, 760, 1.0]];
        let i = 0; while (i < pts.length - 2 && tk > pts[i + 1][2]) i++;

      }
      if (k === 3) { const p = P(tk, 0.05, 0.62), path = $("arc"); const pt = path.getPointAtLength(path.getTotalLength() * E.inOut(p)); W(pt.x, pt.y, tk > 0.69 ? 0.5 : 1, 0, tk > 0.72 ? 0 : 1); $("flag").style.transform = `skewY(${Math.sin(tk * 12) * 4}deg)`; $("flag").style.transformOrigin = "785px 870px"; burst("b3", tk, 0.7, 760, 1236); }
      if (k === 4) { const p = P(tk, 0, 1.0); W(mx(lerp(-200, 1300, p)), 1140, 1, RTL ? 180 : 0); document.querySelectorAll("#lines .speed").forEach((l, i) => { l.style.left = (lerp(1200, -700, (tk * 2.6 + i * 0.13) % 1) * (RTL ? -1 : 1) + (RTL ? 1080 - 300 : 0)) + "px"; }); $("curb").style.transform = `translateX(${-(tk * 2400) % 140}px)`; }
      if (k === 5) { const p = E.out(P(tk, 0.03, 0.8)); W(540, lerp(1750, 720, p), lerp(1.3, 0.6, p), tk * 1100); burst("b5", tk, 0.03, 540, 1720); if (tk > 0.45) burst("b5", tk, 0.45, 540, 1080); }
    }
    if (show("stats", t)) {

      $("ph").style.transform = `translateY(${(1 - ph) * 600}px) scale(${lerp(1, 0.9, E.inOut(P(td, 1.6, 0.4)))})`; $("ph").style.transformOrigin = "50% 0%";
      const tp = clamp(P(td, 0.25, 1.1));

      $("caret").style.opacity = tp < 1 || Math.floor(t * 4) % 2 === 0 ? 1 : 0;
      $("askView").style.opacity = 1 - E.out(P(td, 1.5, 0.18));
      const r = E.out(P(td, 1.6, 0.35)); put($("results"), { op: r, y: (1 - r) * 300 });
      const k = slam(td, 2.05, 0.22, 1.5); put($("ok"), { ...k, r: -2 });

      put($("tagline"), slam(te, 0.45, 0.3));

      put($("fine"), { op: E.out(P(te, 1.3, 0.4)) });

  };
  /** Shrink a headline until its text (not its full-width box) fits the frame. */
  function fit(el, max = 980) { const r = document.createRange(); r.selectNodeContents(el); let fs = parseFloat(getComputedStyle(el).fontSize); while (r.getBoundingClientRect().width > max && fs > 60) { fs -= 4; el.style.fontSize = fs + "px"; } }
